# kcdx load order — user override file.
#
# Edit via the launcher UI (when shipped), or hand-edit here.
#
# Plugins not listed in this file inherit author defaults from their
# own kcdx.toml ([load_order].zone / .priority) and are enabled. Listed
# plugins get the fields below applied on top of those defaults; missing
# fields fall back to the author default.
#
# See docs/load-order.md for the full model.

# ----- Shipped defaults -----
#
# bugsplat-filename-fix is shipped DISABLED because its patch site
# (LEA at VA 0x1824599e7) was empirically proven NOT to feed
# BugSplat's dmp filename construction (the patch lands at DllMain
# time as designed but BugSplat still writes to a colon-truncated
# stub). The plugin's kcdx.toml + source are retained in the release
# zip as the reference template for the eventual correct fix; flip
# enabled = true here once the right patch site is identified.
#
# The planned next investigation step is to hook MiniDumpWriteDump /
# CreateFileW to trace the real filename source.

[[plugin]]
name      = "bugsplat_filename_fix"
enabled   = false
