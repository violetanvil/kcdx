# kcdx engine-fix plugin: bugsplat-filename-fix  (metadata-only stub)
#
# *** STATUS: metadata-only stub, ship-disabled via
#     kcdx-engine/load_order.toml (`enabled = false`). ***
#
# This folder is a placeholder for the eventual BugSplat-filename fix.
# It currently declares NO behavior (no hook, no Lua) — only the
# [plugin] metadata + load-order hint below, kept as the reference
# template for the real before_game-hook builtin.
#
# Why no patch: the original LEA-repoint approach (rewrite a single
# `lea rdx, [rip+disp32]` at VA 0x1824599e7 from the colon-bearing
# app-name string to the filename-safe sibling) was empirically
# disproven against the binary. The patch applied at DllMain time via
# the before_game zone exactly as designed, but BugSplat still wrote a
# colon-truncated "Kingdom Come" stub — that LEA does not feed
# BugSplat's dmp-filename construction. The byte-patch (and its
# AOB/offset/disp32 reference) has been removed; nothing in this stub
# documents a patch that no longer exists.
#
# The real fix is a before_game-hook capability: hook MiniDumpWriteDump
# (or CreateFileW filtered to *.dmp) to observe the actual filename at
# crash time, trace it to its source, and correct it there. This folder
# is rewritten into that builtin once that capability ships.
#
# To activate once the fix ships: replace the metadata below with the
# before_game-hook behavior and remove this plugin's `enabled = false`
# row from kcdx-engine/load_order.toml (default is enabled = true).

[plugin]
name        = "bugsplat_filename_fix"
display_name = "BugSplat Filename Fix"
description = "Fixes KCD2's BugSplat integration so minidumps actually land on disk (the stock filename contains ':' which Windows rejects)."
author      = "kcdx_builtin"
version     = "1.0.0"
supports     = ["1.5*"]

# Load-order positioning. BugSplat's MiniDumpWriteDump-filename helper
# caches the colon-bearing app-name string at WHGame.dll's DllMain time;
# if our LEA-disp32 rewrite lands after that point, the cached path
# already contains the colon and the patch is useless. So this entry
# MUST apply before WHGame.dll's DllMain runs — that's exactly what
# the before_game zone provides via LdrRegisterDllNotification.
#
# Priority 30 keeps room (sparse 0..100) for users to insert other
# before_game fixes earlier (e.g. compatibility-flag patches that
# influence what BugSplat sees) without renumbering.
[load_order]
zone     = "before_game"
priority = 30
