# kcdx engine-fix plugin: bugsplat-filename-fix
#
# Repoints a single LEA in WHGame.dll from the colon-bearing app-name
# string "Kingdom Come: Deliverance II" to the filename-safe sibling
# "Kingdom Come Deliverance II" (no colon). The colon-bearing string
# has 4 xrefs; three are legitimate display-name uses (CVar
# sys_game_name, getter thunk, length-29 hashing loop). The fourth,
# at VA 0x1824599e7, feeds BugSplat's MiniDumpWriteDump filename
# construction. Without this patch, BugSplat tries to write to a
# path containing `:` (illegal on NTFS); the write fails or
# produces a zero-byte stub, and every SEH-trappable KCD2 crash
# (AV, page fault, etc.) leaves Warhorse with no usable dmp.
#
# The replacement string "Kingdom Come Deliverance II" already
# exists in WHGame.dll at VA 0x183e18290 — same length without the
# colon. We just repoint the one LEA's disp32; display-name UI
# (game title bar, sys_game_name CVar) keeps using the original
# colon-bearing string via its three other xrefs.
#
# Static-analyzed by another agent 2026-05-20. Pattern derivation
# + verification recipe lives in docs/known-issues.md §1.
#
# When this stops applying (e.g. after a KCD2 update shifts the
# AOB), the patch silently no-ops with a "0 matches" log line —
# the game continues to work, just without the BugSplat fix
# until the AOB is re-derived.

[plugin]
name        = "kcdx.bugsplat-filename-fix"
display_name = "BugSplat Filename Fix"
description = "Fixes KCD2's BugSplat integration so minidumps actually land on disk (the stock filename contains ':' which Windows rejects)."
author      = "kcdx"
version     = "1.0.0"
compatible_game_versions = ["1.5.1164953"]

[[patch]]
name        = "bugsplat-filename-fix"
description = "Repoint BugSplat call site's LEA disp32 from colon-string to safe-string."
module      = "WHGame.dll"

# AOB anchors on the bytes leading up to + including the LEA
# instruction. Unique in WHGame.dll's .text section.
#
# Breakdown:
#   E8 48 CF 09 FE              call <preceding fn>
#   4C 8B C0                    mov  r8,  rax
#   48 8D 15 ?? ?? ?? ??        lea  rdx, [rip + disp32]    ← patch site
#   48 8D 4C 24 30              lea  rcx, [rsp + 0x30]
#   E8 10 D4 ?? ??              call <next fn>
#
# The 4-byte disp32 immediately follows the `48 8D 15` opcode of
# the LEA. Counting the pattern bytes:
#   byte 0:  E8         (call opcode)
#   bytes 1-4: 48 CF 09 FE  (relative target)
#   bytes 5-7: 4C 8B C0     (mov r8, rax)
#   bytes 8-10: 48 8D 15    (LEA opcode + ModR/M for [rip+disp32])
#   bytes 11-14: ?? ?? ?? ?? ← disp32, the 4 bytes we patch
#   bytes 15+:  48 8D 4C 24 30 E8 10 D4  (rest of context)
# So offset = 11, length = 4. Replacement repoints the disp32 from
# 0x183aa3508 ("Kingdom Come: Deliverance II") to
# 0x183e18290 ("Kingdom Come Deliverance II"). Both strings already
# exist in WHGame.dll; we just change which one this LEA loads.
pattern     = "E8 48 CF 09 FE 4C 8B C0 48 8D 15 ?? ?? ?? ?? 48 8D 4C 24 30 E8 10 D4"
offset      = 11
original    = "1A 9B 64 01"
replacement = "A2 E8 9B 01"
idempotent  = true
