# Test 1 of outfit-swap-test-matrix: [[patch]] byte rewrite.
#
# Baseline. Identical mechanics to the mempatch outfit-swap plugin —
# 3-byte rewrite at the mov r14b, al site that gates the next_outfit
# action binding. Proves kcdx's [[patch]] engine is mempatch-compatible
# (Phase 1 verification), and serves as the reference behavior every
# other method in this matrix gets compared against.
#
# Original instruction:
#   mov  r14b, al    (44 8A F0)   ; cVar2 = IsInCombat()
# Patched to:
#   xor  r14d, r14d  (45 31 F6)   ; cVar2 = 0 (always "not in combat")
#
# Install: copy this folder to
#   <game>/Bin/Win64MasterMasterSteamPGO/plugins/outfit-swap-patch/
# Disable: rename kcdx.toml to kcdx.toml.disabled
#
# Live-verified against KCD2 release_1_5_1164953_841.

[[patch]]
name        = "outfit_swap_patch_test1"
priority    = 100
module      = "WHGame.dll"

# Tier 1 — primary AOB. Confirmed exactly 1 match in current WHGame.dll.
pattern     = "48 81 C1 60 0B 00 00 48 8B 01 FF 50 08 44 8A F0"
offset      = 13
original    = "44 8A F0"
replacement = "45 31 F6"
idempotent  = true

# Tier 2 — bulletproofing. Extends the pattern with the preceding
# `mov rcx, [rax+0x90]` instruction; must also be unique, and the
# Tier-1 pattern must fall entirely inside this context window.
context     = "48 8B 88 90 00 00 00 48 81 C1 60 0B 00 00 48 8B 01 FF 50 08 44 8A F0"

description = """
Test 1 of outfit-swap-test-matrix. The [[patch]] baseline.
"""
