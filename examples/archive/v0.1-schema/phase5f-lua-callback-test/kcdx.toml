# Phase 5f smoke test: TOML-declared hook with lua_callback.
#
# Targets the outfit-swap function entry — same AOB the existing
# outfit-swap-in-combat plugin uses, but the function ENTRY (pattern
# match itself, not +13 into the body where the [[patch]] writes).
#
# The conflict_engine already has the +13 patch site occupied by
# outfit-swap-in-combat, but the function entry is a different address.
# This hook should install successfully and call Phase5fTest.Greet
# from pak Lua whenever the outfit-swap function fires (which happens
# during equipment changes).
#
# Expected log lines on apply:
#   [hook 'phase5f_lua_test'] pattern matches: 1
#   [hook 'phase5f_lua_test'] context matches: 1
#   [hook 'phase5f_lua_test'] lua_callback='Phase5fTest.Greet' wired ...
#
# Expected log line on first fire (during gameplay):
#   <whatever Phase5fTest.Greet logs from pak Lua>

[[hook]]
name        = "phase5f_lua_test"
priority    = 50
pattern     = "48 81 C1 60 0B 00 00 48 8B 01 FF 50 08 44 8A F0"
offset      = 0
return_type = "void"
param_types = []

# Lua function called when the hook fires. Resolved lazily — if
# pak Lua hasn't registered Phase5fTest.Greet by the time the hook
# fires, kcdx logs a warn and lets the original run.
lua_callback = "Phase5fTest.Greet"
