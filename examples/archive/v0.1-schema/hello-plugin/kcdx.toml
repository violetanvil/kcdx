# hello-plugin — kcdx's "hello world" example.
#
# Shows the minimum C++ plugin DLL: register a Lua-callable C function,
# subscribe to engine messages, queue a main-thread task, exercise the
# trampoline pools.
#
# Plugin metadata lives here (in kcdx.toml [plugin]) — NOT in the DLL.
# The DLL just exports kcdxPlugin_Load. See ../../docs/dev-mode.md and
# the new Shape C schema in include/kcdx/Interfaces.h for the full
# kcdx.toml [plugin] / [entrypoints] schema.

[plugin]
name                = "hello_plugin"
display_name        = "Hello Plugin"
author              = "violetanvil"
description         = "Minimal kcdx plugin example"
url                 = "https://github.com/violetanvil/kcdx"
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
version_independent = true  # uses kcdx::ResolveAddress, not pinned to a game build

# DLL auto-discovered: there's exactly one *.dll (hello-plugin.dll) in this
# folder root, so kcdx picks it up automatically. To override (e.g. if you
# add a bundled library), uncomment:
#
# [entrypoints]
# dll = "hello-plugin.dll"
