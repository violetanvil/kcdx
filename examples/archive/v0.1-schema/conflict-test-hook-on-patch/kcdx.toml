# conflict-test-hook-on-patch — kcdx Phase 4b.3 acceptance test
#
# Earlier-priority [[patch]] writes one byte inside the function entry.
# Then a later-priority [[hook]] installs at the same function entry.
# MinHook captures the patched byte into the relocated prologue inside
# its trampoline — both apply successfully.
#
# Expected behavior:
#   - conflict_engine pre-flight: INFO — "Hook will install rel32 jmp ...
#     overlapping bytes already modified by patch ... Both apply, no
#     action needed."
#   - Patch applies first (lower priority number = earlier load order).
#   - Hook installs second; MinHook relocates the patched prologue.
#
# The patch here is a no-op (48 -> 48 identity) so the test doesn't
# actually modify game behavior, only exercises the conflict-engine path.

[[patch]]
name        = "conflict_hook_on_patch_PATCH"
priority    = 100
description = "Earlier patch. Writes byte 0 (identity 48 -> 48) at IsInCombat entry."
pattern     = "48 8B 41 08 48 8B 88 90 00 00 00 48 81 C1 60 0B 00 00 48 8B 01 FF 50 08 3C 02"
offset      = -4
original    = "48"
replacement = "48"
idempotent  = true

[[hook]]
name        = "conflict_hook_on_patch_HOOK"
priority    = 200
description = "Later hook. Installs rel32 jmp at the entry the patch just wrote to."
pattern     = "48 8B 41 08 48 8B 88 90 00 00 00 48 81 C1 60 0B 00 00 48 8B 01 FF 50 08 3C 02"
offset      = -4
bytes       = "31 C0 C3"
