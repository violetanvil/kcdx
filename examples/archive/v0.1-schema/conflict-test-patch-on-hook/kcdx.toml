# conflict-test-patch-on-hook — kcdx Phase 4b.3 acceptance test
#
# Earlier-priority [[hook]] installs a 5-byte rel32 jmp at the IsInCombat
# wrapper's entry. Then a later-priority [[patch]] tries to write a
# single byte at the same address (offset 0 of the function entry).
#
# Expected behavior:
#   - conflict_engine pre-flight: WARN — "Patch 'X' writes inside hook 'Y'..."
#   - Patch's verify will fail at apply time because the bytes at the site
#     are now E9 (jmp opcode) instead of 48 (sub rsp prologue opcode).
#     Patch aborts with the standard "bytes don't match" message, enriched
#     by the conflict_engine cross-reference.

[[hook]]
name        = "conflict_patch_on_hook_HOOK"
priority    = 100
description = "Earlier hook. Installs 5-byte E9 rel32 at IsInCombat entry."
pattern     = "48 8B 41 08 48 8B 88 90 00 00 00 48 81 C1 60 0B 00 00 48 8B 01 FF 50 08 3C 02"
offset      = -4
bytes       = "31 C0 C3"

[[patch]]
name        = "conflict_patch_on_hook_PATCH"
priority    = 200
description = "Later patch. Tries to write byte 0 of IsInCombat (which is now E9 because the hook installed first)."
pattern     = "48 8B 41 08 48 8B 88 90 00 00 00 48 81 C1 60 0B 00 00 48 8B 01 FF 50 08 3C 02"
offset      = -4
original    = "48"
replacement = "48"
idempotent  = false
