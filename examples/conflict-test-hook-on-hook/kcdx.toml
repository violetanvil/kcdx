# conflict-test-hook-on-hook — kcdx Phase 4b.3 acceptance test
#
# Declares TWO [[hook]] entries with the same AOB pattern (so they resolve
# to the same target function entry). conflict_engine should emit a
# HookOnHook WARN at pre-flight time. hook_engine then installs the
# lower-priority hook (first-wins) and aborts the higher-priority one.
#
# Target: the same FUN_1805605b8 IsInCombat wrapper used by no-combat-state-hook.
# (Disable no-combat-state-hook during this test by renaming its folder to
# .disabled, or this becomes a 3-way collision.)
#
# Detour bodies are both `xor eax, eax; ret` (always-return-false). The
# only thing that matters here is the conflict-detection log, not the
# behavior of either detour.

[[hook]]
name        = "conflict_hook_A"
priority    = 100
description = "Half of the hook-on-hook conflict pair. Will install (lower priority = earlier)."
pattern     = "48 8B 41 08 48 8B 88 90 00 00 00 48 81 C1 60 0B 00 00 48 8B 01 FF 50 08 3C 02"
offset      = -4
bytes       = "31 C0 C3"

[[hook]]
name        = "conflict_hook_B"
priority    = 200
description = "Half of the hook-on-hook conflict pair. Will abort (higher priority = later, first-wins)."
pattern     = "48 8B 41 08 48 8B 88 90 00 00 00 48 81 C1 60 0B 00 00 48 8B 01 FF 50 08 3C 02"
offset      = -4
bytes       = "31 C0 C3"
