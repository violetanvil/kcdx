# symbol-producer — kcdx Phase 4b.2 acceptance test (paired with symbol-consumer)
#
# Allocates an 8-byte trampoline filled with `90 90 90 90 90 90 90 90` (eight
# x86 NOPs) and exports its address as `phase4b2.test_region`. The bytes
# don't run as code — they exist purely to demonstrate the cross-plugin
# allocate-and-export pattern.
#
# Pair with examples/symbol-consumer/, which patches a single byte inside
# this region by referencing the same symbol.

[[trampoline]]
name        = "phase4b2_test_region"
description = """
Phase 4b.2 acceptance test: allocate 8 bytes, export as
phase4b2.test_region so symbol-consumer can patch into it.
Initial bytes: eight NOPs (90 90 90 90 90 90 90 90).
"""
priority    = 100
pool        = "branch"
export      = "phase4b2.test_region"
bytes       = "90 90 90 90 90 90 90 90"
