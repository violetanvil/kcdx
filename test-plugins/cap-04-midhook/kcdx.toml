# CAP-04 — [[mid_hook]] call_original = true/false/"auto" self-test.
#
# Each sub-test (a/b/c/d) gets its own [[trampoline]] that ships
# 9 bytes of x86-64 machine code:
#
#   +0:  48 89 C8        mov rax, rcx          ; rax = seed
#   +3:  48 83 C0 64     add rax, 0x64         ; HOOK HERE — adds 100
#   +7:  90              nop                   ; consumed by MinHook's 5-byte rel32 patch
#   +8:  C3              ret
#
# The mid-hook fires at offset +3 (the `add rax, 0x64`), captures rax,
# then EITHER calls-original (rax += 100) OR skip-original (rax
# unchanged). v0.1 does NOT exercise register mutation from Lua —
# kcdxLuaApi lacks Call/Pcall (design-gaps.md item #11), so the Lua
# callback can't invoke args[1]:set(...). CAP-04 verifies the harder
# problem: skip-original codegen works correctly.
#
# Invoking each target with rcx = 10:
#
#   CAP-04a (true, no mutate)         → 10 + 100 = 110  (original runs)
#   CAP-04b (false, no mutate)        →            10   (skipped, no add)
#   CAP-04c (auto, _skip = true)      →            10   (skipped)
#   CAP-04d (auto, no _skip)          → 10 + 100 = 110  (original runs)
#
# Why a separate trampoline per sub-test: each MinHook detour
# installs at a unique target VA. Four targets keeps the sub-tests
# independent (no shared-state confusion).

[kcdx]
test_suite_only = true

[plugin]
name                = "cap_04_midhook"
display_name        = "CAP-04 mid_hook"
author              = "ts"
description         = "Mid-hook capture + mutate + skip-original roundtrip."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
version_independent = true
log_level           = "info"
test_names          = ["CAP-04a", "CAP-04b", "CAP-04c", "CAP-04d"]

# --- Targets: 4 identical 9-byte code stubs, exported by name -----------------

# Exports are BARE names (target_a..d). Under the <pluginname>.<name>
# namespace model the engine derives the prefix from [plugin].name, so these
# register as "<thisplugin>.target_a" etc. Consumers reference the BARE name
# and resolve it via the self tier (the C++ DLL uses ResolveSymbolAs(g_self,
# "target_a"); the [[mid_hook]] target_symbol path threads this plugin's name
# automatically). (naming-namespaces.md)
[[trampoline]]
name   = "cap04_target_a"
pool   = "branch"
export = "target_a"
bytes  = "48 89 C8 48 83 C0 64 90 C3"

[[trampoline]]
name   = "cap04_target_b"
pool   = "branch"
export = "target_b"
bytes  = "48 89 C8 48 83 C0 64 90 C3"

[[trampoline]]
name   = "cap04_target_c"
pool   = "branch"
export = "target_c"
bytes  = "48 89 C8 48 83 C0 64 90 C3"

[[trampoline]]
name   = "cap04_target_d"
pool   = "branch"
export = "target_d"
bytes  = "48 89 C8 48 83 C0 64 90 C3"

# --- Mid-hooks: one per call_original mode ------------------------------------

# (a) call_original = true (default) — capture-only, no mutation.
# Lua callback Cap04Test.OnA does nothing. Original add rax,100 runs.
[[mid_hook]]
name           = "cap04a_true_capture"
priority       = 100
target_symbol  = "target_a"
offset         = 3
param_types    = ["i64"]
param_captures = ["rax"]
lua_callback   = "kcdx.Cap04Test.OnA"
# call_original = true   # back-compat default; omit to verify default

# (b) call_original = false — original skipped at codegen time.
# Lua callback does nothing observable; codegen drops the original.
[[mid_hook]]
name           = "cap04b_false_skip"
priority       = 100
target_symbol  = "target_b"
offset         = 3
param_types    = ["i64"]
param_captures = ["rax"]
lua_callback   = "kcdx.Cap04Test.OnB"
call_original  = false

# (c) call_original = "auto" — Lua sets args._skip = true; dispatcher skips.
[[mid_hook]]
name           = "cap04c_auto_skip"
priority       = 100
target_symbol  = "target_c"
offset         = 3
param_types    = ["i64"]
param_captures = ["rax"]
lua_callback   = "kcdx.Cap04Test.OnC"
call_original  = "auto"

# (d) call_original = "auto" — Lua does NOT set _skip; original runs.
[[mid_hook]]
name           = "cap04d_auto_no_skip"
priority       = 100
target_symbol  = "target_d"
offset         = 3
param_types    = ["i64"]
param_captures = ["rax"]
lua_callback   = "kcdx.Cap04Test.OnD"
call_original  = "auto"
