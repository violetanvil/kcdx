# CAP-04 — mid-hook (kcdx.hook mode=mid) installed on kcdx.code-ALLOCATED memory.
#
# The novel composition: allocate an executable stub with the AUTHOR-FACING
# kcdx.code verb (Lua), then mid-hook into the allocated region with kcdx.hook
# mode=mid, then CALL the hooked stub to observe the mid took effect on
# allocated code. This is distinct from every existing row:
#   - cap-21 hooks a stub allocated via the C++ raw AllocateFromBranchPool floor
#     (a lightuserdata handed to Lua); cap-04 allocates via the Lua kcdx.code
#     verb and hooks `region:add(3)` (a kcdx.code pointer userdata as the
#     `address` locator).
#   - cap-30/cap-40 allocate via kcdx.code but NEVER hook into the result.
# Composing the two new author surfaces — kcdx.code allocate + kcdx.hook mid on
# the allocation — is the row neither covers.
#
# The 9-byte stub (reused verbatim from legacy cap-04 — verified-safe,
# self-contained, no relocations / external calls):
#
#   +0:  48 89 C8        mov rax, rcx     ; rax = seed (arg in rcx, win64)
#   +3:  48 83 C0 64     add rax, 0x64    ; rax += 100   <-- MID HOOK at +3
#   +7:  90              nop              ; padding for MinHook's 5-byte patch
#   +8:  C3              ret              ; return rax
#
# The mid hook captures rax AT +3 (before the add), so rax == seed. Run/skip
# is decided by the Lua callback's RETURN value (the new mode=mid surface; the
# legacy call_original true/false/"auto" knob is GONE — see cap-21).
#
# Architecture (mirrors cap-21's split; the distinguishing axis is WHERE the
# stub comes from + WHAT the hook targets):
#   1. plugin.lua: for each sub-test, kcdx.code{ bytes=<9 bytes>, size=16,
#      pool="branch", export="stub_<sub>" } allocates a fresh stub and publishes
#      its base address as a symbol; then kcdx.hook.mid(.., region:add(3), 0,
#      {"rax"}, function(c) ... end) installs the mid hook at +3.
#   2. ApplyZone installs the mid detours.
#   3. cap-04.dll (C++ companion) resolves each export via
#      ResolveSymbolAs(self, "stub_<sub>"), casts it to int(*)(int), and CALLS
#      it with seed=10 on kcdxMessage_InputLoaded (Lua cannot call a region with
#      an arg — kcdx.memory.pointer has no call method). run -> 110, skip -> 10.
#
# Why C++ owns the CALL and Lua owns the HOOK: skip is Lua-only. The C++
# kcdxHookInterface::Mid callback (void ABI) has NO return-skip primitive
# (src/hook_chain.cpp MidCDispatch — "C mid does not yet expose a return-skip
# primitive"); only the Lua mid callback's `return "skip"` reaches the
# skip-original codegen. So the hook MUST install from Lua. Lua cannot call the
# region with a seed arg, so the C++ companion does the call. The kcdx.code
# export -> ResolveSymbolAs handshake bridges the two halves.
#
# pool="branch" is REQUIRED: the mid hook installs a rel32 jmp into the region,
# which must sit within ±2 GB of WHGame.dll's .text for the branch to reach.

[kcdx]
test_suite_only = true

[plugin]
name                = "cap_04_midhook"
display_name        = "CAP-04 mid-hook on kcdx.code"
author              = "ts"
description         = "kcdx.hook mode=mid installed on a kcdx.code-allocated stub (run/skip on allocated memory)."
version             = "0.2.0"
kcdx_min_version    = "0.1.0"
log_level           = "info"
test_names          = ["CAP-04-mid-on-code-run", "CAP-04-mid-on-code-skip"]

[entrypoints]
dll = "cap-04.dll"
lua = "plugin.lua"
