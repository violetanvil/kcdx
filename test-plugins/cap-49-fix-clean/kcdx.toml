# CAP-49 — manifest-validation: the CLEAN fixture (the no-false-reject guard).
#
# A FULLY VALID manifest exercising the breadth of recognized keys/tables
# (every [plugin] key the allowlist covers, an [entrypoints] lua, a
# [load_order] table, a [[plugin.dependencies]] entry, a test_names array;
# `supports` is omitted on purpose — absent = any version). It MUST LOAD — its
# plugin.lua runs and
# self-reports cap-49-clean-loads PASS at kcdx.on("ready").
#
# This is the falsifiable counterweight to the four reject fixtures: it proves
# the STRICT validation does NOT false-reject a valid manifest. If validation
# over-rejects (e.g. an allowlist entry is missing for a key this manifest
# uses), this plugin never loads, plugin.lua never runs, and cap-49-clean-loads
# never reports → the row sits PENDING → FAIL by absence. The pass
# condition is "the plugin.lua ran at all", which can ONLY happen if the
# manifest passed validation — a falsifiable claim that can actually go red.

[kcdx]
test_suite_only = true

[plugin]
name                      = "cap_49_fix_clean"
display_name              = "CAP-49 clean manifest (must load — no false-reject)"
author                    = "ts"
description               = "A fully valid manifest exercising the breadth of recognized keys + tables; proves strict validation does not false-reject. Self-reports cap-49-clean-loads at ready."
url                       = "https://example.invalid/cap49"
support_email             = "cap49@example.invalid"
version                   = "0.1.0"
kcdx_min_version          = "0.1.0"
log_level                 = "info"
# `supports` is intentionally OMITTED: an absent supports key = "any game
# version" = version-independent by absence (the migrated meaning of the old
# version_independent=true this fixture previously set). This fixture must load
# on whatever build runs the suite, so it pins no version.
test_names                = ["cap-49-clean-loads"]

[[plugin.dependencies]]
name        = "cap_49_observer"
min_version = "0.1.0"
optional    = true

[load_order]
zone     = "after_game"
priority = 50

[entrypoints]
lua = "plugin.lua"
