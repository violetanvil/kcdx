# COMP-09 — kcdx.publish cross-plugin pub/sub: PUBLISHER (plugin A).
#
# Phase 2b sub-9. kcdx.publish("event", payload) broadcasts a custom Lua
# event to kcdx.on("<author>.<plugin>.<event>", fn) subscribers in OTHER plugins.
# A Lua-native layer sharing the kcdx.on subscriber registry (NOT the C++
# kcdxMessage wire format) — the payload is passed BY REFERENCE.
#
# This is the PUBLISHER half. Its companion is comp-09-pubsub-b (the
# subscriber). Cross-plugin pub/sub = a conflict/interaction case, so it's a
# COMP row (COMP-09, the next free comp number).
#
# DETERMINISTIC ORDERING (the critical fixture-design point):
#   A subscriber must be registered BEFORE the publish, or the publish races
#   the subscriber's plugin.lua load. plugin.lua runs at load; a top-level
#   publish at A's load could fire before B's plugin.lua has subscribed. So:
#     * Plugin B subscribes at plugin.lua-LOAD time (kcdx.on at top level).
#     * Plugin A publishes from inside its OWN kcdx.on("input_loaded", ...)
#       handler, which fires on the first update tick — AFTER every
#       plugin.lua has loaded and every subscription is registered. This
#       makes the timing deterministic regardless of A-vs-B load order.
#
# The publish is also the identity-from-inside-a-callback probe: A's
# input_loaded handler is itself a dispatched kcdx.on callback, so a correct
# "ts.comp_09_pubsub_a...." stamp from there proves
# OwningPluginForCurrentCall resolves the publisher correctly when publish is
# called from within a dispatched callback (not just top-level plugin.lua).

[kcdx]
test_suite_only = true

[plugin]
name                = "comp_09_pubsub_a"
display_name        = "COMP-09 pub/sub publisher (A)"
author              = "ts"
description         = "Publishes a custom event with a table payload from its input_loaded handler (deterministic ordering); subscriber is comp-09-pubsub-b."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
log_level           = "info"

[entrypoints]
lua = "plugin.lua"
