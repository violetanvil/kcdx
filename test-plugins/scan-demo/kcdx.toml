# scan-demo — exercises the [[scan]] diagnostic entry.
#
# Not a true regression test (no ReportTestResult call); just a
# demonstration that `[[scan]]` resolves correctly and emits the
# expected log shape. Useful for "did my pattern resolve, and to
# what" questions — the new-modder onramp documented in
# docs/design-gaps.md gap #7.
#
# When dev mode is on, this plugin logs at first-update-tick:
#   [scan 'outfit_swap_site'] pattern matches: 1
#   [scan 'outfit_swap_site'] context matches: 1
#   [scan 'outfit_swap_site'] match 1: pattern at ... -> apply addr ...
#   [scan 'outfit_swap_site']   bytes -16: ...
#   [scan 'outfit_swap_site']   bytes  +0: ...

[kcdx]
test_suite_only = true

[plugin]
name                = "kcdx.scan-demo"
display_name        = "scan-demo (diagnostic [[scan]] showcase)"
author              = "kcdx"
description         = "Shows what [[scan]] output looks like for the outfit-swap site."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
version_independent = true
log_level           = "info"
# No test_names — this plugin doesn't auto-report; it's a log demo.

[[scan]]
name           = "outfit_swap_site"
module         = "WHGame.dll"
pattern        = "48 81 C1 60 0B 00 00 48 8B 01 FF 50 08 44 8A F0"
offset         = 13
context        = "48 8B 88 90 00 00 00 48 81 C1 60 0B 00 00 48 8B 01 FF 50 08 44 8A F0"
