# COMP-02 — kcdx.bytes patch + kcdx.hook detour overlapping at ONE site.
#
# Migration off the legacy [[patch]] + [[hook]] surface
# onto the new kcdx.* surfaces. ONE plugin (comp-02.dll) installs BOTH:
#   - a kcdx.bytes IDENTITY patch (48 -> 48, a genuine no-op) via
#     kcdxBytesInterface::Register, target="IsInCombat_callsite_26b"
#     (id 1006), offset=-4 -> the function entry;
#   - a kcdx.hook REPLACE detour (callback returns false, the migration of
#     the legacy `31 C0 C3` xor-eax,ret) via kcdxHookInterface::Replace on
#     the SAME named site (id 1006), offset=-4 -> the function entry.
# Both resolve to the IDENTICAL function-entry VA (the pattern-hit RVA
# 0x5605BC minus 4, per the id-1006 seed prose). The patch routes through
# the PATCH engine (g_patches / conflict_engine); the hook routes through
# the SEPARATE hook_chain engine.
#
# === THE PROBE: a cross-engine coexist question, UNVERIFIED ================
# Does a kcdx.bytes patch + a kcdx.hook detour on ONE site BOTH apply
# (coexist) in the NEW engines — the way the legacy [[patch]] + [[hook]]
# did? UNKNOWN. The verifier's GetConflictReport assertion at the
# function-entry VA (2 entries, both applied) IS the readout.
#
# OUTCOME MAP (also in comp-02.cpp verifier reasons + README):
#   PASS  (comp02_patch kind=Patch applied + comp02_hook kind=Hook applied,
#          both present) -> cross-engine coexist HOLDS: the kcdx.bytes patch
#          engine + the kcdx.hook hook_chain coexist on one site, like the
#          legacy. Migration done, COMP-02 preserved.
#   FAIL, one of ours present-but-applied=0 -> coexist does NOT hold: the new
#          hook_chain may not relocate/survive a kcdx.bytes patch the way
#          legacy MinHook did, OR the two engines don't see each other's
#          overlap. A REAL FINDING (engine gap or intentional reframe) — the
#          verifier surfaces WHICH one didn't apply, never papers over it.
#   FAIL, GetConflictReport returns < both (only one entry) -> the report
#          doesn't catch both at the query VA (the patch's [begin,end) range
#          vs the hook's exact-VA match) — a GetConflictReport VA-matching
#          issue, DISTINCT from the coexist question. The reason distinguishes
#          "entry absent" from "entry present but applied=0".
#
# No priority block needed: a patch + a hook in ONE plugin are not a
# replace-vs-replace conflict, so there is nothing to order.

[kcdx]
test_suite_only = true

[plugin]
name                = "comp_02_hook_on_patch"
display_name        = "COMP-02 Hook-on-patch overlap"
author              = "ts"
description         = "kcdx.bytes patch + kcdx.hook detour on one site; both should coexist."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
log_level           = "info"
test_names          = ["COMP-02"]

[entrypoints]
dll = "comp-02.dll"
