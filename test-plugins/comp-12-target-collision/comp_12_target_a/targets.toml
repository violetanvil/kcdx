# COMP-12 plugin A — declares the bare target name `combat_check`.
#
# A's `combat_check` is the GOOD locator: the verified luaL_loadfile entry AOB
# + its ABI. Plugin B (sibling folder) declares a target with the SAME bare
# name but a BOGUS pattern that cannot match. When A hooks the bare name
# `combat_check`, self>engine>other precedence must pick A's OWN target (self
# tier) — which resolves and applies. Had B's target won, the hook would FAIL
# to apply (B's pattern matches nothing). So A's hook applying is a falsifiable
# proof that self won, not B.
#
# The bare-name collision (A and B both own `combat_check`) ALSO triggers the
# once-per-session "NAMESPACE" warn naming both owners — observable in the log
# (asserted [manual]; the auto-assertion is that SELF resolved, not OTHER).
[[target]]
name      = "combat_check"
pattern   = "40 55 56 57 48 81 EC 40 02 00 00 48 8B 05 ?? ?? ?? ?? 48 33 C4"
signature = "i32 (ptr L, cstr filename)"
