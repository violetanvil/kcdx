# CAP-70 — kcdx_scan in-game console command: drive it via kcdx.console.execute
# and assert the engine console surface dispatched it. The Lua-driven regression
# net for the engine-owned `~`-console command (src/console_commands_scan.cpp).
#
# This plugin is PURE LUA (no DLL): pure-Lua plugins need no CMakeLists entry
# (cap-26-lua-command / cap-32-scan are the structural mirrors).
#
# kcdx_scan is NOT a kcdx.* surface — it is a console verb (a `~`-console
# command, registered unconditionally at console::Init). It has no Lua/C++
# parity obligation; it IS the cross-surface in-game AOB-discovery tool. So
# this plugin drives it the same way a user would type it: through CryEngine's
# IConsole::ExecuteString, reached from Lua via kcdx.console.execute(line). That
# call fires the command SYNCHRONOUSLY on the main thread and returns true if
# the console surface accepted + dispatched the line. cap-26 is the exact
# template (it drives a Lua-registered command the same way); cap-70 mirrors it
# against the ENGINE-owned kcdx_scan command.
#
# What it proves (the surface is armed at input_loaded, so both rows fire there):
#   * CAP-70-dispatch: kcdx.console.execute('kcdx_scan WHGame.dll "<pattern>"')
#     returns true — the console surface accepted + dispatched the kcdx_scan
#     command. The pattern is a DEEP-INTERIOR .text-UNIQUE AOB (WHGame.dll+0x9800,
#     verified EXACTLY 1 match on WHGame.dll), DETOUR-IMMUNE BY CONSTRUCTION: it
#     sits ~4 KB into its containing function (4035 bytes past the entry), so no
#     co-resident kcdx.hook entry-detour can reach it (a 5-byte JMP detour only
#     clobbers a function's FIRST bytes), and no plugin byte-rewrites it — so it
#     still resolves to 1 match at input_loaded, AFTER the ApplyZone byte-patch
#     pass, regardless of which plugins co-reside. (Two earlier choices were
#     co-resident-hostage and went to 0 by input_loaded: cap-32's outfit-swap
#     AOB, whose tail cap-39 rewrites at the apply pass, and the luaL_openlibs
#     entry AOB, which a co-resident plugin entry-hooks before input_loaded — a
#     fixture-stability defect, not a kcdx_scan bug.) AUTO-PASS = execute returned
#     true (the command exists + dispatched); FALSIFIABLE: if kcdx_scan is not
#     registered or the surface isn't ready, execute returns false → FAIL.
#   * CAP-70-badargv: kcdx.console.execute('kcdx_scan') (missing module +
#     pattern) returns true — the command DISPATCHED and ran its fail-loud
#     usage-line path internally without destabilising the game. AUTO-PASS =
#     execute returned true; FALSIFIABLE: execute returns false or the game
#     destabilises → FAIL.
#   * CAP-70-result: asserts the scan FINDING, not just dispatch. The kcdx.scan{}
#     Lua verb and the kcdx_scan console command share scan_engine::RunScan, so
#     calling kcdx.scan{} against the same verified deep-interior AOB exercises
#     the identical resolve path with a machine-checkable return. Asserts
#     count==1 at the verified site, matches[1].module=="WHGame.dll", and
#     matches[1].offset is a positive number — NOT an exact RVA (the module-
#     relative offset shifts per game build, so an exact compare is flaky-by-
#     construction). This catches a
#     scan that stopped resolving — a regression the execute==true dispatch row
#     CANNOT make, since a registered command that finds nothing still returns
#     true. FALSIFIABLE: count!=1 (site stopped resolving / scan regressed) or
#     wrong module/offset (resolved the wrong site) → FAIL. boot-only: kcdx.scan{}
#     resolves + returns synchronously at the input_loaded fire — no overlay, no
#     player gesture.
#
# The machine auto-pass for BOTH rows is "execute returned true" (the command
# dispatched). The PAINTED kcdx_scan output (`[scan] 1 matches:` + the
# `WHGame.dll+0x...` line for dispatch; the usage line for badargv) is
# human-perceptual — confirmed by the manual `~`-overlay eyeball, NOT by a
# machine signal (the acceptance-signal split: assert the dispatch, eyeball the
# paint).
#
# Test mode: CAP-70-dispatch + CAP-70-badargv are both `console` — the console
# surface must be ARMED (input_loaded) for ExecuteString to dispatch, and the
# painted output is a `~`-overlay eyeball. Both rows self-fire from Lua at
# input_loaded; the user's only extra gesture is opening `~` to read the paint.
# CAP-70-result is `boot-only` — kcdx.scan{} resolves + returns synchronously at
# the input_loaded fire, machine-checkable with no overlay and no player gesture.

[kcdx]
test_suite_only = true

[plugin]
name                = "cap_70_scan_console"
display_name        = "CAP-70 kcdx_scan console command dispatch"
author              = "ts"
description         = "Pure-Lua regression net for the engine-owned kcdx_scan ~-console command: kcdx.console.execute drives 'kcdx_scan WHGame.dll \"<known-good AOB>\"' and asserts the console surface dispatched it (execute==true), plus a missing-argv dispatch that proves the fail-loud usage path runs without crashing, plus a result-assertion (CAP-70-result) that asserts the scan FINDING (count==1 at the verified deep-interior site) via the kcdx.scan{} verb over the shared resolve path. The painted overlay output is the manual eyeball; the result assertion is machine-checkable boot-only."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
log_level           = "info"
test_names          = ["CAP-70-dispatch", "CAP-70-badargv", "CAP-70-result"]

[entrypoints]
lua = "plugin.lua"
