# PROBE — require/package.path routing (THROWAWAY).
#
# *** THIS IS A PROBE, NOT A REGRESSION TEST. ***
# It is a throwaway suite-gated plugin that answers ONE checkable runtime
# unknown, then is removed. Its lessons fold into the real multi-file /
# require loader step (gated on this probe's outcome). Do NOT promote this
# to a permanent matrix row — when the loader step lands, delete this
# folder. (Per .claude/rules/results-driven.md "Live-game unknowns — build
# the probe, hand over the launch".)
#
# CHECKABLE UNKNOWN:
#   Does CryEngine's compiled-Lua shared lua_State expose a WORKING
#   require / package.path for a kcdx plugin — i.e. can plugin.lua
#   require("helper") resolve and load a SIBLING helper.lua in this same
#   plugin folder?
#
# SETTLED (do not re-probe): package/require ARE compiled in (luaopen_package
#   id 1177, ll_require id 1108); package.loadlib (the C-LIBRARY searcher)
#   is DEAD (no LUA_USE_DLOPEN, per pak-mods.md). The C-lib path is a
#   DIFFERENT searcher from the Lua-FILE searcher this probe targets.
#   kcdx wires NO package.path today. OPEN question is purely: is the
#   Lua-FILE searcher live, and what is package.path on the live state?
#
# This probe is PURE LUA (no DLL, no [[hook]]). Pure-Lua plugins need no
# CMakeLists entry (cap-24-lifecycle-events is the structural mirror).
#
# Test mode: boot-only — the probe fires when plugin.lua loads on boot;
# launch-to-menu confirms it. No console / no in-game gesture.

[kcdx]
test_suite_only = true

[plugin]
name                = "kcdx.probe-require-routing"
display_name        = "PROBE require/package.path routing"
author              = "kcdx"
description         = "Throwaway probe: does require('helper') load a sibling .lua on the live shared lua_State? Diagnostic log under REQUIRE_PROBE is the deliverable."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
version_independent = true
log_level           = "info"
test_names          = ["PROBE-require-sibling"]

[entrypoints]
lua = "plugin.lua"
