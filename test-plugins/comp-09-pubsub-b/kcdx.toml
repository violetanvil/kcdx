# COMP-09 — kcdx.publish cross-plugin pub/sub: SUBSCRIBER (plugin B).
#
# Phase 2b sub-9. The subscriber half. Its companion is comp-09-pubsub-a
# (the publisher). B subscribes at plugin.lua-LOAD time to plugin A's custom
# event via the "<publisher>:event" name form; A publishes from its
# input_loaded handler (after all plugin.lua loaded), so B's subscription is
# guaranteed registered before the publish (deterministic ordering — see
# comp-09-pubsub-a/kcdx.toml).
#
# B owns the COMP-09 test row: its subscriber callback asserts it RECEIVED
# the event AND the table payload arrived intact (payload.x == 42,
# payload.name == "Noble"), proving (a) the payload rode by reference and
# (b) A's publisher namespace resolved correctly (the event fired under
# "ts_comp_09_pubsub_a:outfit_changed", which is the name B subscribed to).
#
# test_names pre-registers the row so the aggregator counts it even before
# the callback fires (PENDING until input_loaded fires on boot).

[kcdx]
test_suite_only = true

[plugin]
name                = "ts_comp_09_pubsub_b"
display_name        = "COMP-09 pub/sub subscriber (B)"
author              = "kcdx"
description         = "Subscribes to plugin A's published custom event and asserts the table payload arrived by reference with the right publisher namespace."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
version_independent = true
log_level           = "info"
test_names          = ["COMP-09-pubsub"]

[entrypoints]
lua = "plugin.lua"
