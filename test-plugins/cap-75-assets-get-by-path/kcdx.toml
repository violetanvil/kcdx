# CAP-75 — the kcdx.assets.* author surface: the five runtime/read verbs
# (get_by_path / get_by_name / declare / register / replace), own + cross-plugin
# forms, against the §5.1 runtime store.
#
# get_by_path resolves the calling plugin's own asset (no owner prefix) to a
# loadable on-disk path (a pure read). declare publishes <author>.<plugin>.<name>
# -> a file; get_by_name resolves a published name back. register adds a runtime
# vpath -> file overlay; replace registers a runtime replacement keyed by the
# target. All four runtime verbs resolve `file` through the caller's assets/
# (like get_by_path); a bad path / name / target -> a teaching error naming it,
# never a silent nil (AP14).
#
# The cross-plugin forms kcdx.plugin.<author>.<plugin>.assets.get_by_path /
# .get_by_name resolve through the cap-74 navigable namespace — the .assets leaf
# on a resolved plugin handle binds the read verb to the NAVIGATED plugin. These
# rows navigate THIS plugin's OWN identity (author "ts", plugin
# "cap_75_assets_get_by_path") because self > engine > other guarantees it is
# loaded — the reliable known-present target (the cap-74 rationale).
#
# This plugin ships a real asset under assets/icons/ so the own + cross-plugin
# reads resolve to a real file; the missing rows ask for a path / name NOT
# present to prove the teaching errors fire (never a silent nil).
#
# Eleven falsifiable rows, all boot-only (every check is a pure in-process store
# write+read + the on-disk assets/ tree, no player gesture):
#
#   * CAP-75-own            — get_by_path("icons/marker.txt") returns the
#       loadable path ending with the relative path. FALSIFIABLE: nil / empty /
#       wrong path -> FAIL.
#   * CAP-75-missing        — get_by_path("icons/does_not_exist.dds") returns
#       (nil, err) naming the missing path. FALSIFIABLE: bare nil / non-nil /
#       err not naming the path -> FAIL.
#   * CAP-75-cross          — kcdx.plugin.ts.<this>.assets.get_by_path(...)
#       resolves through the namespace. FALSIFIABLE: chain raises / nil -> FAIL.
#   * CAP-75-declare        — declare("shirt", "icons/marker.txt") publishes,
#       and get_by_name("shirt") resolves it back to the same file's path — a
#       store round-trip. FALSIFIABLE: declare nil for a real file / get_by_name
#       nil after declaring / a path not the declared file -> FAIL.
#   * CAP-75-getbyname-missing — get_by_name("never_declared_name") returns
#       (nil, err) naming it. FALSIFIABLE: non-nil / bare nil / err not naming
#       the name -> FAIL.
#   * CAP-75-getbyname-cross — kcdx.plugin.ts.<this>.assets.get_by_name("shirt")
#       resolves the name declared in CAP-75-declare through the namespace (§6).
#       FALSIFIABLE: chain raises / nil / wrong file -> FAIL.
#   * CAP-75-register       — register(vpath, real file) returns the loadable
#       path (overlay written); register(vpath, missing file) teaches loud.
#       FALSIFIABLE: nil for a real file / non-nil-or-bare-nil for a missing
#       file -> FAIL. (The in-game SERVE is CAP-75-register-serve, README.)
#   * CAP-75-replace        — replace(target, real file) returns the loadable
#       path (overlay keyed by target written); replace(target, missing file)
#       teaches loud. FALSIFIABLE: same shape as register.
#
# Test mode: boot-only (the eleven rows above). The register/replace IN-GAME
# serve (engine opens a registered vpath -> kcdx's file, confirmed by the agent
# reading `overlay_opened ... source=runtime`) is the [manual]/in-game
# CAP-75-register-serve matrix row in test-plugins/README.md.

[kcdx]
test_suite_only = true

[plugin]
name                = "cap_75_assets_get_by_path"
display_name        = "CAP-75 kcdx.assets.get_by_path"
author              = "ts"
description         = "Pure-Lua kcdx.assets.* runtime-surface self-test: get_by_path own/missing/cross; declare publishes a name and get_by_name resolves it back (a published-name store round-trip, own + the §6 cross-plugin form); get_by_name for an undeclared name teaches loud; register and replace write the runtime-overlay store and return the loadable path, with a missing source file teaching loud (AP14); a boot-opened vpath teaches loud (the runtime overlay can't serve a boot-cached asset — use the declarative sidecar). Eleven boot-only falsifiable rows; the register/replace in-game serve is the [manual] CAP-75-register-serve matrix row."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
log_level           = "info"
test_names          = ["CAP-75-own",
                       "CAP-75-missing",
                       "CAP-75-cross",
                       "CAP-75-declare",
                       "CAP-75-getbyname-missing",
                       "CAP-75-getbyname-cross",
                       "CAP-75-register",
                       "CAP-75-replace",
                       "CAP-75-replace-real-vpath",
                       "CAP-75-replace-crossmod-unresolvable-teach",
                       "CAP-75-replace-boot-asset-warn"]

[entrypoints]
lua    = "plugin.lua"
assets = "assets/"
