# CAP-33 — author-declared named targets (targets.toml) + kcdx.alias.
#
# The regression for the whole author-targets feature: a plugin declares its
# own named targets in a targets.toml sidecar, then refers to them BY NAME from
# kcdx.hook / kcdx.bytes — the disassembler-test "share guarantee"
# (cornerstones.md §36): an expert names an AOB site ONCE, a non-expert hooks
# it by name with no hex and no ABI.
#
# This plugin is PURE LUA + TOML (no DLL) — no CMakeLists entry needed (the
# structural mirrors are cap-24/cap-25/cap-26/cap-30, all pure-Lua).
#
# What it proves (all boot-only, no player gesture):
#   * CAP-33-pattern-by-name (THE §36 HEADLINE): kcdx.hook{ target =
#     "ui_pump_by_pattern" } resolves the author-declared PATTERN target
#     (CGame_per_frame_ui_pump, seed id 1003) end-to-end — the pattern supplies
#     the ADDRESS and the target's signature supplies the ABI, both from the
#     bare name (NO signature= on the hook). PASS iff :applied()==true at
#     "ready". This is the proof a pattern site named once is hookable by name
#     with zero hex/ABI at the call site.
#   * CAP-33-engine-tier: kcdx.hook{ target = "luaL_loadfile" } (an ENGINE seed
#     name) still resolves — the engine tier of self>engine>other coexists with
#     the author's own targets.
#   * CAP-33-prefixed: the explicit "<pluginname>.<target>" form
#     ("cap_33_author_targets.ui_pump_by_pattern") resolves directly.
#   * CAP-33-bytes-by-name: kcdx.bytes{ target = "pcall_safe_site" } resolves
#     an author-declared PATTERN target (lua_pcall, seed id 1000 — a DISTINCT
#     function from the hooked CGame_per_frame_ui_pump) to a VA; an idempotent
#     no-op write (0x48 over the existing 0x48) :applied()==true proves the
#     resolution.
#   * CAP-33-alias: kcdx.alias("up", "cap_33_author_targets.ui_pump_by_pattern")
#     then kcdx.hook{ target = "up" } resolves the hook via the local alias.
#
# Test mode: boot-only. Every target/alias resolution + apply happens during
# the launch-time registration + apply pass; the handles read final at
# kcdx.on("ready") (after this plugin's zone apply pass), all before the main
# menu — no console typing, no in-game gesture.

[kcdx]
test_suite_only = true

[plugin]
name                = "cap_33_author_targets"
display_name        = "CAP-33 author-declared named targets + alias"
author              = "kcdx"
description         = "Author-declared targets.toml self-test: a pattern target with a signature hooked BY NAME end-to-end (cornerstones §36), engine-tier + explicit-prefix + alias resolution, and a kcdx.bytes target=<name> resolution."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
version_independent = true
log_level           = "info"
test_names          = ["CAP-33-pattern-by-name", "CAP-33-engine-tier",
                       "CAP-33-prefixed", "CAP-33-bytes-by-name",
                       "CAP-33-alias"]

[entrypoints]
lua = "plugin.lua"
