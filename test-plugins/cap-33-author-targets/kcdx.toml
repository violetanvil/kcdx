# CAP-33 — author-declared named targets (targets.toml) + kcdx.alias.
#
# The regression for the whole author-targets feature: a plugin declares its
# own named targets in a targets.toml sidecar, then refers to them BY NAME from
# kcdx.hook / kcdx.bytes — the disassembler-test "share guarantee"
# (cornerstones.md §36): an expert names an AOB site ONCE, a non-expert hooks
# it by name with no hex and no ABI.
#
# This plugin is PURE LUA + TOML (no DLL) — no CMakeLists entry needed (the
# structural mirrors are cap-24/cap-25/cap-26/cap-30, all pure-Lua).
#
# What it proves (all boot-only, no player gesture):
#   * CAP-33-pattern-by-name (THE §36 HEADLINE — BLOCKED, NOT silenced):
#     kcdx.hook{ target = "ui_pump_by_pattern" } is the pure "author names a
#     target BY AOB PATTERN and hooks it by name" proof (pattern → address,
#     target signature → ABI, both from the bare name; NO signature= on the
#     hook). It is BLOCKED: the AOB matches the ENTRY prologue of
#     CGame_per_frame_ui_pump (seed id 1003), which cap-03 hooks in production —
#     the detour overwrites the prologue, so the post-patch pattern scan finds
#     0 (patch_engine.cpp:124-130). No verified .text-unique entry-prologue AOB
#     exists yet for a function NOTHING entry-hooks; minting one is bounded
#     tier-5 work. This row will fail/parse-skip at apply until that AOB is
#     minted — EXPECTED and TRACKED. See
#     docs/outstanding-work/section36-pattern-target-aob.md.
#   * CAP-33-engine-tier: kcdx.hook{ target = "luaL_loadfile" } (an ENGINE seed
#     name) still resolves — the engine tier of self>engine>other coexists with
#     the author's own targets.
#   * CAP-33-prefixed: the explicit "<pluginname>.<target>" form
#     ("ts_cap_33_author_targets.luaopen_math_by_id") resolves directly. Points at
#     the VERIFIED-ID target (luaopen_math by address_id=1172 — an UNHOOKED verified
#     leaf; RVA-resolved, no scan), so it proves PREFIX resolution and passes.
#   * CAP-33-bytes-by-name: kcdx.bytes{ target = "bool_leaf_safe_site" }
#     resolves an author-declared VERIFIED-ID target (lua_toboolean,
#     address_id=1124 — a DISTINCT verified leaf that NOTHING hooks, so its
#     prologue is pristine) to a writable VA; an idempotent no-op write (0x48
#     over the existing 0x48 — byte 0 of the lua_toboolean entry, read from
#     WHGame.dll) :applied()==true proves the resolution.
#   * CAP-33-alias: kcdx.alias("up", "ts_cap_33_author_targets.luaopen_math_by_id")
#     then kcdx.hook{ target = "up" } resolves the hook via the local alias to
#     the same VERIFIED-ID target, so it proves ALIAS resolution and can pass.
#
# Test mode: boot-only. Every target/alias resolution + apply happens during
# the launch-time registration + apply pass; the handles read final at
# kcdx.on("ready") (after this plugin's zone apply pass), all before the main
# menu — no console typing, no in-game gesture.

[kcdx]
test_suite_only = true

[plugin]
name                = "ts_cap_33_author_targets"
display_name        = "CAP-33 author-declared named targets + alias"
author              = "kcdx"
description         = "Author-declared targets.toml self-test: a pattern target with a signature hooked BY NAME end-to-end (cornerstones §36), engine-tier + explicit-prefix + alias resolution, and a kcdx.bytes target=<name> resolution."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
version_independent = true
log_level           = "info"
test_names          = ["CAP-33-pattern-by-name", "CAP-33-engine-tier",
                       "CAP-33-prefixed", "CAP-33-bytes-by-name",
                       "CAP-33-alias"]

[entrypoints]
lua = "plugin.lua"
