# CAP-33 — author-declared named targets (the targets.toml sidecar).
#
# Each [[target]] row declares a BARE name + exactly one locator; the engine
# stamps the <pluginname> prefix derived from [plugin].name
# (cap_33_author_targets) automatically — the author NEVER types their own
# prefix (naming-namespaces.md). A pattern/rva target SHOULD carry a
# `signature` (no engine name to carry the ABI — the disassembler test).

# --- The §36 HEADLINE: a PATTERN-located target WITH a signature. -----------
# This is the cornerstones.md §36 "share guarantee" proof in one row: an
# expert names an AOB site ONCE (here), and a non-expert hooks it BY NAME with
# no hex and no hand-written ABI — the pattern resolves the WHERE and this
# signature carries the ABI, both delivered by the bare name.
#
# Pattern + signature both target CGame_per_frame_ui_pump (Address Library
# id 1003 — a VERIFIED, live-tested row in data/address-library/seed.csv):
#   - AOB:  the 25-byte .text-unique function-entry prologue, copied verbatim
#           from seed.csv id 1003's notes (verified against KCD2 1.5).
#   - sig:  the verified ABI from seed.csv id 1003 — void (ptr self).
# CGame_per_frame_ui_pump is a direct callee of CGame::Update; cap-03 hooks it
# in production and it is dormant enough that installing a no-op detour is
# harmless (the same safe-target reasoning cap-20 uses for CAP-20-target).
[[target]]
name      = "ui_pump_by_pattern"
pattern   = "48 89 5C 24 08 48 89 74 24 10 57 48 83 EC 20 80 B9 C1 05 00 00 00 48 8B D9"
signature = "void (ptr self)"

# --- A pattern author-target for the kcdx.bytes resolution proof. -----------
# A DISTINCT verified function from the hooked CGame_per_frame_ui_pump:
# lua_pcall (Address Library id 1000 in seed.csv — verified, hooked in
# production). Using a DIFFERENT function avoids any hook/bytes overlap on one
# address — the cap-33 hooks all target CGame_per_frame_ui_pump, so the byte
# write here lands on untouched memory. kcdx.bytes resolves this name to the
# entry VA; the write is an idempotent no-op (write byte 0x48 over the existing
# 0x48 — the AOB begins "48 89 5C 24"), so it applies cleanly without changing
# behaviour. We assert RESOLUTION via :applied()==true, not a destructive edit.
# (A bytes target is untyped — no signature needed.)
[[target]]
name    = "pcall_safe_site"
pattern = "48 89 5C 24 ? 57 48 83 EC 40 33 C0 41 8B F8"
