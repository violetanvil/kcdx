# CAP-33 — author-declared named targets (the targets.toml sidecar).
#
# Each [[target]] row declares a BARE name + exactly one locator; the engine
# stamps the <pluginname> prefix derived from [plugin].name
# (ts.cap_33_author_targets) automatically — the author NEVER types their own
# prefix (shared names are <author>.<plugin>-prefixed; the engine derives the
# prefix from the manifest). A pattern/rva target SHOULD carry a
# `signature` (no engine name to carry the ABI — the disassembler test).

# --- The SHARE-GUARANTEE HEADLINE: a PATTERN-located target WITH a signature. -
# This is the "share guarantee" proof in one row: an
# expert names an AOB site ONCE (here), and a non-expert hooks it BY NAME with
# no hex and no hand-written ABI — the pattern resolves the WHERE and this
# signature carries the ABI, both delivered by the bare name.
#
# Pattern + signature both target luaL_openlibs (Address Library id 1190,
# verified RVA 0x01449600, sig "void (ptr L)"). The AOB is the 16-byte
# .text-unique entry prologue minted + uniqueness-confirmed (EXACTLY 1 match,
# at the function's own RVA) by an AOB scan against the binary:
#   48 89 5C 24 08 57 48 83 EC 20 48 8B F9 48 8D 1D
# (mov [rsp+8],rbx; push rdi; sub rsp,0x20; mov rdi,rcx; + the `lea rbx,[rip+...]`
# opcode triplet — the slice stops BEFORE the RIP-relative disp32, the first
# variable byte; every byte kept is fixed, zero wildcards).
#
# WHY THIS RESOLVES (vs the prior id-1003 attempt that was BLOCKED): the by-NAME
# pattern scan runs at REGISTRATION time (plugin load), BEFORE this plugin's own
# before-hook is applied at the first-update-tick apply pass — so at the moment
# the scan runs the entry prologue is still pristine and the AOB matches (the
# post-patch-scan caveat patch_engine.cpp:124-130 does not bite — nothing has
# overwritten the prologue yet). NOTE: this plugin ITSELF entry-hooks
# luaL_openlibs (that IS the proof) — once the apply pass installs the before-hook
# the first 5 prologue bytes become a JMP detour, so a SCAN of this same AOB at a
# later lifecycle point (e.g. input_loaded) would find 0. cap-33's resolution is
# unaffected because it resolves at registration; a scan-finding assertion at
# input_loaded must use a detour-immune deep-interior site (see cap-70). It is
# called EXACTLY ONCE at Lua boot (CScriptSystem::Init), so a no-op before-hook is
# minimal-frequency, and it is DISTINCT from the prefix/alias target (id 1172) and
# the bytes target (id 1124) — no overlap. The minting is recorded in seed.csv
# id 1190's notes.
[[target]]
name      = "openlibs_by_pattern"
pattern   = "48 89 5C 24 08 57 48 83 EC 20 48 8B F9 48 8D 1D"
signature = "void (ptr L)"

# --- A VERIFIED-ID author-target for the prefix / alias resolution proofs. ---
# luaopen_math (Address Library id 1172, verified RVA 0x009299AC, sig
# "i32 (ptr L)"). Located by address_id — RVA-resolved, NO scan, so it is IMMUNE
# to the prologue-overwrite problem the pattern row hits. Chosen because it is a
# VERIFIED leaf that NOTHING entry-hooks: the live run only hooks
# CGame_per_frame_ui_pump (id 1003) + the two IsInCombat callsites (1006/1007),
# engine production hooks lua_pcall (1000) / CGame::Update (1001) / l_alloc via
# g->frealloc (1192), and no test-plugin hooks/targets this function or id 1172.
# This is DISTINCT from the bytes target lua_toboolean (id 1124) below, so the
# hook target and the bytes target never overlap.
#
# NOTE on the EARLIER target (id 1003, CGame_per_frame_ui_pump): cap-03 ALREADY
# entry-hooks id 1003 via the legacy [[hook]] path (first-wins), so a second
# hook on it loses with "already hooked by 'cap03_update_callee'". Repointed here
# to an UNHOOKED function so the prefix/alias install can succeed.
#
# luaopen_math is lualibs[] entry 6 — invoked EXACTLY ONCE during luaL_openlibs
# at Lua boot, never again. A no-op before-hook installs a detour that fires at
# most once at init; this is far lower-frequency than any per-call VM primitive
# (lua_type/lua_gettable/lua_settop/etc.), minimising main-thread-callback
# exposure (the engine auto-marshals an off-thread hook hit to the main thread
# before firing a Lua callback). The prefixed and alias rows point at THIS
# target so they prove PREFIX and ALIAS resolution end-to-end and can pass,
# instead of inheriting the pattern row's blocker.
[[target]]
name       = "luaopen_math_by_id"
address_id = 1172
signature  = "i32 (ptr L)"

# --- A VERIFIED-ID author-target for the kcdx.bytes resolution proof. -------
# lua_toboolean (Address Library id 1124 in seed.csv — verified RVA 0x00B9C1AC,
# sig "i32 (ptr L, i32 idx)"). A DISTINCT, verified leaf that NOTHING hooks:
# production hooks lua_pcall (1000) + CGame::Update; cap-03/cap-33 hook
# CGame_per_frame_ui_pump (1003) — none touch this function, so its prologue is
# pristine and a byte READ of the original bytes is correct. Resolving by
# address_id (no scan) is immune to the prologue-overwrite problem anyway.
# Byte 0 of the lua_toboolean entry is 0x48 (read directly from WHGame.dll:
# entry bytes "48 83 EC 28 E8 ..."), so the idempotent same-byte write (0x48
# over 0x48) verifies AND applies without changing behaviour. We assert
# RESOLUTION via :applied()==true, not a destructive edit. (Bytes target is
# untyped — no signature needed.)
[[target]]
name       = "bool_leaf_safe_site"
address_id = 1124
