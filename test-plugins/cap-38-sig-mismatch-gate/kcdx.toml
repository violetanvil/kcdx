# CAP-38 — sig-mismatch gate (C++ half). See cap-38.cpp for the full
# row contract + the behavior-c keep-and-proceed design.
#
# The footgun the gate closes: named target carrying a verified ABI +
# an explicit opts.signature was SILENTLY trusted (the explicit sig used
# as-is, the verified ABI never cross-checked) — an AP12 footgun on the
# exact surface AP12 protects. The gate's core behavior is (c): keep +
# proceed (consult the verified ABI to DETECT the conflict, emit a teaching
# diagnostic, then proceed with the explicit sig as authored). The diagnostic
# SEVERITY splits by ClassifyConflict — cap-38's arg-count delta (1 vs 2) is
# a HARD conflict → the gate logs at ERROR (a known crash risk on a live
# engine function); a soft same-shape conflict stays at WARN.
#
# This C++ plugin drives kcdxHookInterface with the named target
# `kcdx.lua_settable` (engine seed id 1186, verified "void (ptr L, i32
# idx)") + the WRONG explicit sig "void (ptr L)" (1 arg → arg-count delta
# → NOT SignaturesCompatible → the gate fires). The Lua half is the
# sibling cap-38-sig-mismatch-gate-lua/ plugin (parity-is-tested).
#
# Rows:
#   * CAP-38-cpp-gate-proceeds (AUTO, boot-only, asserted at
#     kcdxPlugin_PostGameLoad): handle != 0 && IsApplied()==true && the
#     before observer fired (lua_settable is called all over boot → the
#     hook is live and marshalling per the explicit 1-arg sig). Falsifiable
#     against a hypothetical (a)-reject impl: a reject would give handle 0 /
#     IsApplied false / observer never fires → FAIL.
#   * CAP-38-cpp-gate-warn ([manual], log-assert): the orchestrator greps
#     the engine log for the gate's ERROR-level HARD line (action
#     explicit_overrides_verified_hard, severity=hard). NOT auto-reported by
#     this plugin (the auto row asserts behavior-c PROCEEDED, which is byte-
#     identical pre/post-fix; only the ERROR line distinguishes them).
#
# Test mode: boot-only (the auto row). The manual row is an
# orchestrator-side log grep, no in-game gesture.

[kcdx]
test_suite_only = true

[plugin]
name                = "cap_38_sig_mismatch_gate"
display_name        = "CAP-38 sig-mismatch gate (C++)"
author              = "ts"
description         = "C++ DLL: names kcdx.lua_settable (verified ABI) with a WRONG explicit opts.signature; asserts the sig-mismatch gate ERRORs (arg-count delta = hard conflict) + PROCEEDS with the explicit sig (behavior-c) — install succeeds, hook fires."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
version_independent = true
log_level           = "info"
test_names          = ["CAP-38-cpp-gate-proceeds"]

[load_order]
priority = 50

[entrypoints]
dll = "cap-38.dll"
