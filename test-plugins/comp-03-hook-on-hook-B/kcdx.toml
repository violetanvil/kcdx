# COMP-03 plugin B — loser half of the cross-plugin hook-on-hook pair.
#
# Phase 4b Batch 2 migration: was a legacy [[hook]] mirroring plugin A's
# bytes= entry at priority=200; now a kcdxHookInterface::Replace install in
# this DLL (comp-03-B.cpp), at the SAME named site as plugin A, with
# default_priority=200.
#
# The deferred apply pass orders entries ACROSS plugins by (PLUGIN
# load-order priority asc, name asc) — lua_registry.cpp reads
# kcdx::load_order::Of(pluginName).priority (the default_priority). A is
# 100, B is 200, so A sorts first → A does the first-touch (the applied
# winner) and B hits FindChain-non-null → CanCoexist (replace-vs-replace is
# exclusive) rejects it → recorded in chain->rejected (applied=false).
#
# B's DLL companion subscribes to the after-phase, resolves the target VA
# via api->ResolveAddressByName("IsInCombat_callsite_with_stack_frame"),
# calls GetConflictReport(va), and asserts:
#   - exactly 2 hook entries returned
#   - one named "comp03_a" with applied != 0 (A, the winner)
#   - one named "comp03_b" with applied == 0 (B, CanCoexist-rejected)
#   - both kind = Hook
# On match, reports COMP-03 PASS. On mismatch, FAIL with a diagnostic.
# Plugin A reports nothing — only B's observation matters.

[kcdx]
test_suite_only = true

[plugin]
name                = "comp_03_b"
display_name        = "COMP-03 Hook-on-hook loser (plugin B)"
author              = "ts"
description         = "Higher-priority (200) replace in the cross-plugin COMP-03 pair. CanCoexist-rejected; verifies the outcome via GetConflictReport."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
version_independent = true
log_level           = "info"
default_priority    = 200
test_names          = ["COMP-03"]

[entrypoints]
dll = "comp-03-B.dll"
