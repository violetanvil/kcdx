# COMP-03 plugin A — winner half of the cross-plugin hook-on-hook pair.
#
# Phase 4b Batch 2 migration: was a legacy [[hook]] with bytes= first-wins;
# now a pure-Lua kcdx.hook{replace} on the SAME named site. Two plugins
# (this one and comp-03-hook-on-hook-B) install a `replace` at the same
# function entry — replace-vs-replace is exclusive in the hook_chain
# (CanCoexist rejects the second), so one wins and one is rejected.
#
# WHICH one wins is decided by the deferred apply pass, which orders
# entries ACROSS plugins by (PLUGIN load-order priority asc, name asc) —
# lua_registry.cpp:429-447 reads kcdx::load_order::Of(pluginName).priority,
# i.e. the plugin's default_priority. This plugin is default_priority=100;
# plugin B is 200. 100 < 200, so THIS entry sorts first → does the
# first-touch that builds the chain (the applied winner). B's entry hits
# FindChain-non-null → CanCoexist fails → recorded in chain->rejected
# (applied=false). The PLUGIN priority is the deterministic lever — there
# is no per-hook priority knob on kcdx.hook.
#
# Target: the IsInCombat callsite wrapper at WHGame.dll RVA 0x566040,
# named `IsInCombat_callsite_with_stack_frame` (Address Library id 1007,
# verified). It is the FUNCTION ENTRY (comp-03 hooked at offset 0). The
# `target=` NAME locator resolves the address; the legacy bytes= detour
# needed no signature (raw bytes), but a kcdx.hook replace DOES — the seed
# carries no signature for id 1007, so this plugin supplies one (see below).
#
# Signature `bool (ptr self)` — evidence from the seed AOB:
#   48 83 EC 28        sub rsp, 0x28          (its own stack frame)
#   48 8B 41 08        mov rax, [rcx+8]       (rcx = this/object pointer → 1 ptr arg)
#   ...                walks [rax+0x90], +0x0B60, calls a vtable method
#   3C 01              cmp al, 1              (return tested as a byte → bool)
# The legacy detour `31 C0 C3` = xor eax,eax; ret → returns 0. The replace
# returns 0 (false), and the engine writes the bool back to eax — exactly
# reproducing the old xor-eax detour. Making this combat-state predicate
# always return false during boot is harmless (the player is not in combat
# in the title-screen flow).
#
# Plugin A has no DLL companion. Its only job is to WIN the install and
# report NOTHING. The verification — GetConflictReport shows A applied and
# B rejected — lives in plugin B's DLL.

[kcdx]
test_suite_only = true

[plugin]
name                = "comp_03_a"
display_name        = "COMP-03 Hook-on-hook winner (plugin A)"
author              = "ts"
description         = "Lower-priority (100) replace in the cross-plugin COMP-03 pair. Wins the replace conflict; reports nothing."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
version_independent = true
log_level           = "info"
default_priority    = 100

[entrypoints]
lua = "plugin.lua"
