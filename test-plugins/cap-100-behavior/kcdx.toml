# CAP-100 — kcdx.behavior.* declare/set/get/list (the named-behavior
# registry's single-plugin surface: declare + the read side + the set record
# + the apply boundary).
#
# A real Lua plugin that DECLARES + SETS behaviors at load (the load-time
# acts), then asserts: declare registers under the engine-stamped
# <author>.<plugin>.<bare> full name (this plugin's prefix:
# ts.cap_100_behavior.); a spec missing a required field (description /
# non-nil default / implementation) RAISES a teaching error naming the field;
# a duplicate same-full-name declare errors on the SECOND declare while the
# FIRST stands and keeps resolving; get returns the recorded value once set,
# else the spec's default; a load-time set RECORDS immediately and the apply
# boundary (post-RunPostGameLoad, pre-InputLoaded) invokes the implementation
# EXACTLY ONCE with the final value; set(name, nil) raises the unset-sentinel
# teaching error; the §5.4 post-load TOGGLE contract — a post-load set on a
# `revert` declarer calls revert(old)+implementation(new) and records (the
# never-applied gate skips revert; the two declarer-code failure dispositions
# clear-or-keep the record, attributed to the declarer), while a revert-less
# behavior raises the applies-at-load teaching error and a post-load declare
# raises the load-time-act error (the post-load-DECLARE wall gates on the
# apply-boundary state — BoundaryCompleted — symmetric with the post-load SET
# gate, so a declare from the input_loaded handler trips it); list([prefix])
# returns the registered behaviors with name/description/default/current/
# declarer and the prefix filter scopes to this plugin's own entries.
#
# What it proves (all boot-only, auto-pass; declares + sets + fixture pcalls
# run at load; load-observable rows report at ready, boundary-dependent rows
# report at input_loaded — the earliest post-boundary point):
#   1. cap-100-declare-list — two clean declares register; list() carries the
#      stamped full names with the right description / default / declarer.
#      FALSIFIABLE: a declare raises, the stamped name is absent from list(),
#      or an entry field is wrong -> FAIL.
#   2. cap-100-missing-field-errors — three bad specs (no description, nil
#      default, no implementation) each RAISE with the missing field named in
#      the error; none of the rejected names registers.
#      FALSIFIABLE: a bad declare succeeds, the error text lacks the field
#      name, or a rejected name shows up in list() -> FAIL.
#   3. cap-100-duplicate-second-errors — the SECOND declare of one full name
#      raises ("already declared"); the FIRST declaration still resolves via
#      get and answers ITS default.
#      FALSIFIABLE: the second declare succeeds, the error lacks "already
#      declared", get raises, or get answers the second spec's default -> FAIL.
#   4. cap-100-get-default — get on a never-set behavior returns the spec's
#      default, via BOTH the bare self-resolved name and the explicit full
#      <author>.<plugin>.<bare> form; get on an undeclared name raises a
#      teaching error (never a silent nil).
#      FALSIFIABLE: a wrong/nil value, or a silent non-raise on the unknown
#      name -> FAIL.
#   5. cap-100-list-prefix-filter — list("ts.cap_100_behavior.") returns
#      EXACTLY this plugin's own successfully-declared entries (count + every
#      name carries the prefix).
#      FALSIFIABLE: a foreign entry passes the filter, an own entry is
#      missing, or the count is wrong -> FAIL.
#   6. cap-100-alias-get — a kcdx.alias local handle to a declared behavior's
#      full name resolves through get to the same value as the direct
#      full-name get (alias substitution feeds the behavior resolution).
#      FALSIFIABLE: the alias path raises or returns a different value -> FAIL.
#   7. cap-100-set-nil-error — set(name, nil) RAISES the unset-sentinel
#      teaching error; the standing record is untouched.
#      FALSIFIABLE: the nil set succeeds, the error doesn't teach the
#      unset rule, or the record changed -> FAIL.
#   7a. cap-100-set-typo-error — §6 branch b (loaded, no such bare): a set
#      on the own full name with a non-existent bare RAISES "declares no
#      behavior" pointing at list("<owner>.").
#      FALSIFIABLE: the typo set succeeds, or the error lacks the wording /
#      the list() pointer -> FAIL.
#   7b. cap-100-set-bare-no-declarer — §6 branch d: a set on a bare name no
#      plugin declares RAISES "no plugin loaded so far declares <bare>"
#      pointing at the full <author>.<plugin>.<bare> form.
#      FALSIFIABLE: the bare set succeeds, or the error lacks the wording /
#      the full-name pointer -> FAIL.
#   7c. cap-100-set-owner-absent — §6 branch c (absent): a set on a full
#      name whose <author>.<plugin> is not installed RAISES "belongs to
#      <owner>, which is not installed" with NO reorder suggestion.
#      FALSIFIABLE: the absent set succeeds, the error lacks "not
#      installed", or it suggests a reorder -> FAIL.
#   8. cap-100-set-records-and-applies — the load-time set records
#      immediately (get answers 99 pre-boundary) and the apply boundary
#      invokes the implementation EXACTLY ONCE with the final value
#      (counter==1, captured==99); get still answers 99 post-boundary.
#      FALSIFIABLE: the set raises, the record isn't visible, the
#      implementation fires 0 or 2+ times, receives a different value, or
#      the post-boundary get drifts -> FAIL.
#   9. cap-100-post-load-set-error — a post-load set on a REVERT-LESS behavior
#      ('counted', no revert) RAISES the applies-at-load teaching error
#      (naming the `revert` fix); the applied record is untouched.
#      FALSIFIABLE: the post-load set succeeds (get would lie), the error
#      doesn't teach the applies-at-load/revert rule, or the record changed
#      -> FAIL.
#  10. cap-100-toggle-revert-order — US-5: a post-load set on an APPLIED
#      `revert` declarer calls revert(old) THEN implementation(new) in that
#      order (observed via a shared call log) and records the new value.
#      FALSIFIABLE: the toggle raises, the calls are out of order/missing,
#      revert/impl receive the wrong old/new value, or get doesn't track the
#      new value -> FAIL.
#  11. cap-100-toggle-never-applied — the never-applied gate: a post-load set
#      on a `revert` declarer NEVER set at load calls implementation(new)
#      ONLY (revert skipped) and records.
#      FALSIFIABLE: the toggle raises, revert FIRES, impl gets the wrong
#      value, or get doesn't track the new value -> FAIL.
#  12. cap-100-toggle-impl-raises — revert succeeds, implementation RAISES:
#      the record + applied flag clear to unset (get returns the default —
#      the world is reverted), logged against the declarer, the set does NOT
#      re-raise at the consumer call site.
#      FALSIFIABLE: the set re-raises at the consumer, or get doesn't return
#      the default after the cleared record -> FAIL.
#  13. cap-100-toggle-revert-raises — revert ITSELF raises: the record +
#      applied state stay AS THEY WERE (get still reads the loaded value),
#      logged against the declarer, the set does NOT re-raise at the consumer.
#      FALSIFIABLE: the set re-raises at the consumer, or get no longer reads
#      the loaded value -> FAIL.
#  14. cap-100-post-load-declare-error — the post-load DECLARE wall (§5.4:
#      declares are a load-time act). A declare from the input_loaded handler
#      (post-boundary, BoundaryCompleted()==true) RAISES the load-time-act
#      teaching error and registers nothing. The declare-window gate is
#      re-grounded on the apply-boundary state (BoundaryCompleted), symmetric
#      with the post-load SET gate — so this is boot-exercisable from
#      input_loaded.
#      FALSIFIABLE: the post-load declare succeeds (the wall did not trip),
#      the error does not teach the load-time-act rule, or the attempted name
#      appears in list() afterward (it registered despite the error) -> FAIL.
#
# Test mode: boot-only (launch-to-menu confirms all fourteen rows; no player
# input).

[kcdx]
test_suite_only = true

[plugin]
name                = "cap_100_behavior"
display_name        = "CAP-100 kcdx.behavior declare/set/get/list"
author              = "ts"
description         = "Pure-Lua self-test of the kcdx.behavior single-plugin surface: declare stamps + registers, missing-field specs raise teaching errors, a duplicate declare errors on the second while the first stands, get answers the recorded value once set else the spec's default (bare + full-name resolution; unknown names raise), a load-time set records immediately and the apply boundary invokes the implementation exactly once with the final value, set(name, nil) raises the unset-sentinel error, the §5.4 post-load toggle contract holds (a `revert` declarer toggles revert-then-impl and records; the never-applied gate skips revert; the impl-raises and revert-raises failure dispositions clear-or-keep the record attributed to the declarer; a revert-less behavior raises its applies-at-load teaching error; a post-load declare from input_loaded raises the load-time-act teaching error and registers nothing — the declare wall gates on the apply-boundary state, symmetric with the post-load set gate), and list's prefix filter scopes to the plugin's own entries."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
log_level           = "info"
test_names          = [
    "cap-100-declare-list",
    "cap-100-missing-field-errors",
    "cap-100-duplicate-second-errors",
    "cap-100-get-default",
    "cap-100-list-prefix-filter",
    "cap-100-alias-get",
    "cap-100-set-nil-error",
    "cap-100-set-typo-error",
    "cap-100-set-bare-no-declarer",
    "cap-100-set-owner-absent",
    "cap-100-set-records-and-applies",
    "cap-100-post-load-set-error",
    "cap-100-toggle-revert-order",
    "cap-100-toggle-never-applied",
    "cap-100-toggle-impl-raises",
    "cap-100-toggle-revert-raises",
    "cap-100-post-load-declare-error",
]

[entrypoints]
lua = "plugin.lua"
