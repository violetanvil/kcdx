# CAP-03 — [[hook]] + lua_callback (TOML-declared hook dispatches to pak Lua).
#
# Hooks a function called every tick from WHGame.dll's CGame::Update (the
# function kcdx already detours as `update`). The chosen target is a direct
# callee of update — a per-frame UI/menu pump at 0x180865FB4 in KCD2
# 1.5.1164953. By construction it fires every tick AFTER kcdx's hook-install
# moment (first-update-tick), so the dispatch chain is exercised many times
# before the player even sees the main menu.
#
# A DLL companion subscribes to kInputLoaded and reports CAP-03 pass
# if the counter > 0 (the hook fired at least once during boot).
#
# Sig discovered 2026-05-19 via the callee-enumeration tool at
# _research/cap03-recon/cap03_find_candidates.py (disassembles WHGame.dll, finds
# update() via the yobson1 sig, walks its direct CALL targets, emits
# 24-byte function-entry sigs with .text-uniqueness checks). Full
# candidate dossier: _research/predecessor-sigs/CAP-03-CANDIDATES.md
# (candidate #4).
#
# Earlier attempt: luaL_loadfile, which installed cleanly but fired only
# during pre-update Scripts/ loading (before kcdx's hooks installed).

[kcdx]
test_suite_only = true

[plugin]
name                = "cap_03_hook_lua_callback"
display_name        = "CAP-03 Hook + lua_callback"
author              = "ts"
description         = "TOML-declared hook dispatches to pak Lua during boot."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
version_independent = true
log_level           = "info"
test_names          = ["CAP-03"]

[[hook]]
name        = "cap03_update_callee"
priority    = 100
module      = "WHGame.dll"
pattern     = "48 89 5C 24 08 48 89 74 24 10 57 48 83 EC 20 80 B9 C1 05 00 00 00 48 8B D9"
offset      = 0

# void __fastcall fn(this_ptr*)
# kcdx's typed dispatch: single ptr (this) → void
# The Lua callback receives the this pointer as a kcdx.memory.pointer userdata.
# Callback should not dereference it (object layout not known); it exists
# purely to confirm the dispatch chain fired.
return_type = "void"
param_types = ["ptr"]

lua_callback = "Cap03Test.OnUpdateCallee"

description = """
CAP-03 of the kcdx test suite. Verifies [[hook]] + lua_callback chain
fires from a real engine function during boot. The hook target is a
direct callee of CGame::Update, so it fires every tick AFTER kcdx's
own first-update-tick — strictly post-install, on the main thread.
"""
