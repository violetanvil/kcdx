# CAP-03 — function hook via kcdx.hook.before (migration).
#
# Migrated off the legacy [[hook]] + lua_callback (pak Lua) path onto the
# pure-Lua kcdx.hook surface. Same site, same observable, new mechanism:
#   - was: a [[hook]] TOML block (pattern AOB at a CGame::Update callee,
#     lua_callback="Cap03Test.OnUpdateCallee") + a pak-Lua callback that
#     bumped a counter and reported CAP-03 from an EventSystemListener.
#   - now: plugin.lua installs the SAME named site via kcdx.hook.before(...),
#     bumps a counter in the before callback, and reports CAP-03 from
#     kcdx.on("ready").
#
# The target is an un-named site (a direct callee of CGame::Update at
# 0x180865FB4 in KCD2 1.5.1164953) — it has no Address Library name, so the
# migration keeps the SAME pattern= AOB + signature="void (ptr)". This is the
# LEGITIMATE labeled expert hatch for a target the library can't name yet
# (the common path is a target name; the raw pattern is the expert escape
# hatch), NOT a gap. By construction the site fires every
# tick AFTER kcdx's hook-install moment, so the counter is >0 well before the
# main menu — confirming the dispatch chain fired.

[kcdx]
test_suite_only = true

[plugin]
name                = "cap_03_hook_lua_callback"
display_name        = "CAP-03 Function hook (kcdx.hook before)"
author              = "ts"
description         = "Function hook via kcdx.hook.before on an un-named CGame::Update callee; before callback bumps a counter, asserts installed + fired (migration off legacy [[hook]]+pak)."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
log_level           = "info"
test_names          = ["CAP-03"]

[entrypoints]
lua = "plugin.lua"
