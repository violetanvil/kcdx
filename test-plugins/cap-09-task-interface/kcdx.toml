# CAP-09 — kcdxTaskInterface: queue work for the main thread.
#
# QueryInterface(Task), enqueue a task. The task's Run() fires on the
# next update tick (main thread) and calls ReportTestResult. If the
# task interface fails to acquire, we report FAIL at Plugin_Load.

[kcdx]
test_suite_only = true

[plugin]
name                = "cap_09_task_interface"
display_name        = "CAP-09 Task interface"
author              = "ts"
description         = "Verifies main-thread task scheduling."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
log_level           = "info"
test_names          = ["CAP-09"]
