# CAP-01 — byte rewrite via kcdx.bytes (Phase 4a pilot migration).
#
# FIRST plugin migrated off the legacy [[patch]] TOML path onto the
# pure-Lua kcdx.bytes surface. Same site, same observable, new mechanism:
#   - was: a [[patch]] TOML block + a companion verifier DLL.
#   - now: plugin.lua calls kcdx.bytes{...} and self-verifies in Lua.
#
# The byte rewrite (mov r14b, al = 44 8A F0  ->  xor r14d, r14d = 45 31 F6)
# at the outfit-swap site is unchanged. plugin.lua asserts the rewrite
# applied (handle:applied()==true) AND independently reads the 3 rewritten
# bytes back via kcdx.scan + a pointer userdata. See plugin.lua.

[kcdx]
test_suite_only = true

[plugin]
name                = "cap_01_patch"
display_name        = "CAP-01 Patch byte-rewrite"
author              = "ts"
description         = "Verifies kcdx.bytes applies + bytes match post-apply (Phase 4a pilot migration off [[patch]])."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
log_level           = "info"
test_names          = ["CAP-01"]

[entrypoints]
lua = "plugin.lua"
