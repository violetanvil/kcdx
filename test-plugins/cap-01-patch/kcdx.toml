# CAP-01 of kcdx test suite: [[patch]] byte rewrite.
#
# Baseline. The same 3-byte outfit-swap patch the mempatch plugin
# does, re-expressed as a kcdx [[patch]] entry. Proves kcdx's patch
# engine is mempatch-compatible (Phase 1 acceptance) and serves as
# the reference behavior every other test row gets compared against.
#
# Original instruction:
#   mov  r14b, al    (44 8A F0)   ; cVar2 = IsInCombat()
# Patched to:
#   xor  r14d, r14d  (45 31 F6)   ; cVar2 = 0 (always "not in combat")
#
# Live-verified against KCD2 release_1_5_1164953_841.
#
# Gated on dev mode: when dev mode is off, kcdx silently skips
# this file. Production users see no log noise. See
# kcdx/docs/dev-mode.md for the gating mechanic.
#
# Auto-pass check: the patch's `applied successfully ...` line in
# kcdx.log is the PASS signal. (No DLL companion yet; CAP-01's
# auto-pass relies on log scraping. A future improvement is a
# tiny stub DLL that asserts the post-apply bytes equal the
# replacement, then calls ReportTestResult.)
#
# Manual confirm: enter combat in-game, attempt outfit swap from
# inventory. Vanilla blocks with a popup; patched allows it.

[kcdx]
test_suite_only = true

[[patch]]
name        = "cap-01-patch"
priority    = 100
module      = "WHGame.dll"

# Tier 1 — primary AOB. Confirmed exactly 1 match in current WHGame.dll.
pattern     = "48 81 C1 60 0B 00 00 48 8B 01 FF 50 08 44 8A F0"
offset      = 13
original    = "44 8A F0"
replacement = "45 31 F6"
idempotent  = true

# Tier 2 — bulletproofing. Extends the pattern with the preceding
# `mov rcx, [rax+0x90]` instruction; must also be unique, and the
# Tier-1 pattern must fall entirely inside this context window.
context     = "48 8B 88 90 00 00 00 48 81 C1 60 0B 00 00 48 8B 01 FF 50 08 44 8A F0"

description = """
CAP-01 of the kcdx test suite. The [[patch]] baseline.
"""
