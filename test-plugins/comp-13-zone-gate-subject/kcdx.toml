# COMP-13 — zone_gate REJECTION-PATH end-to-end: SUBJECT (the rejected half).
#
# The zone_gate regression close-out (two-flag gating engine + wiring + log
# enrichment + synthetic stub + kcdx.plugin.is_rejected + docs).
#
# WHAT THIS PLUGIN PROVES:
#   This plugin is DESIGNED TO BE REJECTED. It declares
#   [load_order].zone = "before_game" — which trips the synthetic
#   After-required capability entry kcdx.zone_gate_test_after_only in
#   zone_gate's capability table (src/zone_gate.cpp kCapabilities[]).
#   zone_gate runs in EvaluateAllPlugins at config-load time (well BEFORE
#   any plugin.lua runs), flips this plugin's engineAccepted=false, records
#   the reason under zone_gate::g_rejected, and the engine logs the loud
#   teaching PLUGIN_REJECTED line. By the time any init site reaches THIS
#   plugin the enriched skip-log "rejected by zone_gate: ..." fires and
#   the plugin.lua never runs.
#
#   THE REJECTION IS THE TEST. The observer half (comp-13-zone-gate-observer,
#   zone-compatible, NOT rejected) is what reports the COMP-13 row — it
#   asserts kcdx.plugin.is_rejected("ts.comp_13_zone_gate_subject") returns
#   (true, reason) with reason containing "after_game" (the API's required
#   zone, per the binder's reason-string shape at zone_gate.cpp::Check()).
#
# WHY IT'S A `comp` ROW (not `cap`):
#   The end-to-end proof is a 2-plugin interaction. The subject gets
#   rejected by the gate at config-load; the observer queries
#   kcdx.plugin.is_rejected and asserts the rejection persisted. Two
#   plugins, one assertion thread, cross-plugin observable via the
#   accessor — same shape as comp-09 (publisher/subscriber pair) and
#   comp-12 (collider/asserter pair).
#
# DETERMINISTIC ORDERING (no race):
#   zone_gate evaluates every manifest in EvaluateAllPlugins, which runs
#   in LoadAllConfigs at config-load time — well before ANY plugin.lua
#   runs (the rejection is recorded into g_rejected synchronously, before
#   the apply pass even begins). By the time the observer's
#   kcdx.on("ready") handler fires (at end of the after_game apply pass,
#   after EVERY plugin.lua has had its turn), the subject's rejection
#   has long been on file. No A-vs-B load-order race exists — the
#   rejection precedes any Lua execution by orders of magnitude.
#
# WHY [plugin].author = "ts" + [plugin].name = "comp_13_zone_gate_subject":
#   The full prefixed name the observer references is
#   "ts.comp_13_zone_gate_subject" (the 2-dot <author>.<plugin> form —
#   when a plugin references ANOTHER plugin's whole identity, use the
#   explicit prefixed form).
#
# NO test_names FIELD: the subject reports nothing — its plugin.lua never
# runs because the gate rejected it. The observer owns the single row.

[kcdx]
test_suite_only = true

[plugin]
name                = "comp_13_zone_gate_subject"
display_name        = "COMP-13 zone_gate subject (rejected by gate)"
author              = "ts"
description         = "Declares [load_order].zone=before_game, which trips the synthetic After-required capability entry; gets rejected by zone_gate at config-load time. Its plugin.lua never runs — the rejection IS the test (the observer asserts it via kcdx.plugin.is_rejected)."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
log_level           = "info"
# The lua entrypoint must be declared so plugin discovery passes, but
# its body is INERT BY DESIGN — the gate flips engineAccepted=false
# before any RunAll site reaches this plugin, and the enriched
# skip-log fires instead.
[entrypoints]
lua = "plugin.lua"

# THE TRIGGER: [load_order].zone = "before_game" causes load_order::Resolve
# to stamp this plugin's Effective.zone = BeforeGame; zone_gate's Check()
# then walks kCapabilities[], hits the synthetic kcdx.zone_gate_test_after_only
# row (RequireZone::After), finds the mismatch (this plugin is before_game
# but the API requires after_game), and rejects with the reason string
# built at zone_gate.cpp::Check() lines 114-122. (As of the Phase-7 zone-rework
# subset, the per-plugin manifest key IS `[load_order].zone` — the parser no
# longer reads the legacy `[plugin].default_position`. This per-plugin
# [load_order] table is distinct from kcdx-engine/load_order.toml's top-level
# [[plugin]] user-override rows, which a separate parser reads.)
[load_order]
zone = "before_game"
