# CAP-40 — kcdxTrampolineInterface v2 (C++ mirror of kcdx.code) end-to-end.
#
# Phase 3 sub-3 step 4 (FINAL) — the verification plugin that proves the v2
# peers (Allocate + Export) of the raw AllocateFrom*Pool floor work for a real
# C++ DLL author. Steps 1-3 wired the ABI: the header decl (kcdxCodeOptions +
# Allocate/Export appended to kcdxTrampolineInterface, _Version bumped to 2u),
# the src/trampoline.cpp engine impl (Thunk_Allocate alloc+memcpy+NOP-pad+
# export-register; Thunk_Export standalone symbols::Register), and K.code on
# Kcdx.h already fetching kcdxTrampolineInterface at version 2u. This plugin is
# the FIRST non-Lua-binder consumer of Allocate/Export and the C++ PEER of the
# Lua kcdx.code test coverage (parity-is-tested, lua-api-surface.md).
#
# Shape: NATIVE C++ DLL plugin. Init the K wrapper, allocate plugin-owned
# executable memory via K.code->Allocate (with + without an export) and publish
# a standalone symbol via K.code->Export at kcdxPlugin_Load, then assert at the
# after_game C++ export (kcdxPlugin_PostGameLoad, fired after ApplyZone(
# AfterGame) and before kcdxMessage_InputLoaded; the cap-36 / cap-39 pattern).
# kcdx.code allocation is PLUGIN-OWNED memory (no game site), so there is NO
# cap-01-style conflict entanglement and NO dual-Lua boundary issue — every
# observable is verified in-process.
#
# The 3 rows:
#
#   * CAP-40-cpp-code-allocate            The all-in-one Allocate proof.
#       Allocate "mov eax,42; ret" (B8 2A 00 00 00 C3) with bytesSize=6,
#       size=10, pool=branch. Assert region != null AND the first 6 bytes read
#       back == the written bytes AND the tail [6,10) == 0x90 (NOP-pad) AND
#       casting region to int(*)() and CALLING it returns 42 (executable proof).
#       FALSIFIABLE: null / wrong head / non-0x90 pad / call != 42 → FAIL.
#
#   * CAP-40-cpp-code-export              The Allocate-with-export publish path.
#       Allocate with exportName="cap40_region" (BARE). Assert region != null
#       AND K.api->ResolveSymbolAs(K.self, "cap40_region") == the region
#       address. Proves publish-via-Allocate + consume-via-ResolveSymbol — the
#       export= gap sub-3 closes. FALSIFIABLE: unresolved / wrong addr → FAIL.
#
#   * CAP-40-cpp-code-export-standalone   The standalone Export (no allocation).
#       K.code->Export(K.self, "cap40_standalone", &static) for an address the
#       plugin already holds. Assert Export==true AND ResolveSymbolAs(K.self,
#       "cap40_standalone") == that address. FALSIFIABLE: false / wrong → FAIL.
#
# Test mode: boot-only. All three rows self-verify at kcdxPlugin_PostGameLoad;
# an InputLoaded backstop (cap-36 / cap-39 design) reports a loud FAIL on all
# rows if the after-phase export never fired. NO console gestures, NO save/load,
# NO in-game action.

[kcdx]
test_suite_only = true

[plugin]
name                = "cap_40_cpp_code"
display_name        = "CAP-40 kcdxTrampolineInterface v2 (C++)"
author              = "ts"
description         = "C++ DLL exercising kcdxTrampolineInterface v2 end-to-end: K.code->Allocate (alloc+fill+NOP-pad+executable region, with + without export) and K.code->Export (standalone publish), each consumed via K.api->ResolveSymbolAs. C++ peer of the Lua kcdx.code coverage."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
version_independent = true
log_level           = "info"
test_names          = ["CAP-40-cpp-code-allocate",
                       "CAP-40-cpp-code-export",
                       "CAP-40-cpp-code-export-standalone"]

[entrypoints]
dll = "cap-40.dll"
