# CAP-23 — plugin.lua error line-info quality regression.
#
# This plugin's plugin.lua DELIBERATELY throws a RUNTIME error every boot.
# That error IS the test: the loader (src/lua_plugin_loader.cpp) captures
# the error text and asserts — fixture-agnostically, for ANY plugin.lua
# runtime error it sees — that the captured text carries a ':<line>:'
# marker (piece 1: storedebug-on line info) AND a "stack traceback:"
# (piece 2: the pcall errfunc traceback). It reports the verdict under the
# name "cap-23-lua-error-lineinfo".
#
# The error is dev-mode-only (test_suite_only) and is the behavior under
# test — NOT noise to suppress. Do not "fix" plugin.lua's error; it is the
# fixture. (See plugin.lua's own comment.)
#
# test_names pre-registers the row as PENDING until the loader reports it
# (same pattern as cap-20-hook-modes).

[kcdx]
test_suite_only = true

[plugin]
name                = "cap_23_lua_error"
display_name        = "CAP-23 plugin.lua error line-info"
author              = "ts"
description         = "Deliberate plugin.lua runtime error; loader asserts captured text carries file:line + stack traceback."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
log_level           = "info"
test_names          = ["cap-23-lua-error-lineinfo"]

[entrypoints]
lua = "plugin.lua"
