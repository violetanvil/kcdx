# PROBE (KI-0002) — scan-returns-0-at-input_loaded timing isolator.
#
# THROWAWAY probe fixture (not a permanent regression row). Fills the empty
# cells of the timing × pattern 2×2 the existing fixtures never isolated:
# cap-32 scans the outfit-swap AOB at PLUGIN LOAD (=1); cap-70-result scans the
# luaL_openlibs AOB at INPUT_LOADED (=0). Those differ in BOTH timing AND
# target-RVA, so "timing is the isolated variable" is unproven. This probe runs
# the SAME luaL_openlibs AOB via kcdx.scan{} at BOTH plugin-load AND
# input_loaded, and the outfit-swap AOB at input_loaded — one launch attributes
# the 0 to timing-alone vs target-RVA-alone vs both.
#
# Each cell self-reports its raw count via kcdx.test.report so the suite signal
# carries the observation (the agent reads the log; the user only launches).
# Pattern held constant across timing; timing held constant across pattern.
#
# Remove this fixture once KI-0002 is closed (the permanent regression lives in
# cap-32 / cap-70).

[kcdx]
test_suite_only = true

[plugin]
name                = "probe_ki2_scan_timing"
display_name        = "PROBE KI-0002 scan timing isolator"
author              = "ts"
description         = "Throwaway KI-0002 probe: runs the luaL_openlibs AOB via kcdx.scan{} at both plugin-load and input_loaded, and the outfit-swap AOB at input_loaded, reporting each raw count to isolate timing vs target-RVA. Remove on KI-0002 close."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
log_level           = "info"
test_names          = ["PRB-KI2-openlibs-load", "PRB-KI2-openlibs-input", "PRB-KI2-outfit-input"]

[entrypoints]
lua = "plugin.lua"
