# CAP-49 reject fixture (2/4): WRONG-TYPED value on a known [plugin] key.
#
# Valid, distinct author+name (ts.cap_49_fix_wrong_type) so the reject is
# name-queryable; the reject is on a known key carrying the WRONG TYPE —
# `version` is declared as a boolean where the allowlist requires a string.
# ParsePluginManifest's ValidateTableKeys pass rejects it
# (#4 wrong-type) and returns false; LoadOneFile records the parse-reject under
# both the folder path and "ts.cap_49_fix_wrong_type".
#
# No plugin.lua + no [entrypoints]: rejected at parse time, never loads. The
# cap-49-observer asserts is_rejected("ts.cap_49_fix_wrong_type") == (true,
# reason) → the cap-49-reject-wrong-type row.
#
# MUST REJECT. If validation stops rejecting a wrong-typed known key, this
# plugin loads (version falls through OptString to empty, silently
# discarding the author's intent — a silent-success that validated OK but
# dropped the value), is_rejected returns false →
# the observer's cap-49-reject-wrong-type row FAILs.

[kcdx]
test_suite_only = true

[plugin]
name                = "cap_49_fix_wrong_type"
display_name        = "CAP-49 reject: wrong-typed known [plugin] key"
author              = "ts"
description         = "Declares version as a boolean where a string is required — MUST be rejected by the wrong-type validation. Identity is valid so the reject is queryable by name."
version             = true
kcdx_min_version    = "0.1.0"
