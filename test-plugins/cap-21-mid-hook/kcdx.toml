# CAP-21 — kcdx.hook mode="mid": capture read/write + run/skip.
#
# The first test of the NEW kcdx.hook mid surface. Uses
# ONLY restructured-model surfaces:
#   - a C++ DLL entrypoint (hand-writes controlled stubs into RWX memory,
#     hands their capture-site addresses to Lua, drives verify)
#   - plugin.lua calling kcdx.hook.mid(module, target, offset, captures, callback, [opts])
# No legacy [[hook]]/[[mid_hook]]/[[trampoline]] behavior TOML.
#
# Flow (single update tick, in strict order):
#   1. DLL kcdxPlugin_Load allocates 4 RWX stubs (int fn(int)->seed+100,
#      hook site at +2 = the `add rax,0x64`), registers cap21.addr_*.
#   2. plugin.lua runs: fetches each capture-site address, installs mid
#      hooks via kcdx.hook (captures rax; reads/writes/skips per sub-test).
#   3. ApplyZone installs the mid detours (make_jit_midfunc).
#   4. kcdxMessage_InputLoaded fires (AFTER apply): the DLL calls each stub
#      directly and checks the captured-instruction behavior, reports CAP-21*.
#
# Sub-tests (the rax rows capture rax at the `add rax,0x64` site, seed=10):
#   CAP-21-read   callback asserts c.rax:get()==10, returns nothing -> 110
#   CAP-21-write  callback c.rax:set(1000), returns nothing -> 1100
#   CAP-21-skip   callback returns "skip" -> add skipped -> 10
#   CAP-21-run    callback returns nothing -> add runs -> 110 (control)
#   CAP-21-mem    MEMORY capture [rcx]:set(1000) -> mov re-reads 1000 -> 1100
#                 (proves the Context64 memory-deref writeback, not just F1 GPR)
#   CAP-21-xmm    XMM capture xmm0:set(50.0) -> cvttss2si converts 50.0 -> 50
#                 (proves the Context64 XMM-lane read/write)

[kcdx]
test_suite_only = true

[plugin]
name                = "cap_21_mid_hook"
display_name        = "CAP-21 kcdx.hook mode=mid"
author              = "ts"
description         = "kcdx.hook mode='mid': capture :get()/:set() + run/skip via return."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
log_level           = "info"
test_names          = ["CAP-21-read", "CAP-21-write", "CAP-21-skip",
                       "CAP-21-run", "CAP-21-mem", "CAP-21-xmm"]

[entrypoints]
dll = "cap-21.dll"
lua = "plugin.lua"
