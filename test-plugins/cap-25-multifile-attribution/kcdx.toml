# CAP-25 — multi-file plugin + complete source attribution (Phase 2b
# multi-file/require step).
#
# A plugin's plugin.lua can now `require("helper")` and the kcdx searcher
# (installed in Lua 5.1 package.loaders) resolves it against the plugin's
# OWN folder (a sibling helper.lua). At the searcher's compile point, kcdx
# calls RegisterScriptOwner(helperPath, pluginName) — so EVERY source the
# plugin loads (entrypoint AND require'd helper) lands in g_scriptOwners
# owned by the plugin, and a kcdx.* call from inside the helper resolves to
# the plugin (via the unchanged OwningPluginForCurrentCall frame walk), NOT
# "<anon>".
#
# THE COMPLETENESS CRITERION THIS TEST PROVES (non-negotiable):
#   EVERY source a plugin loads resolves identically to that plugin from any
#   source. The test FAILS if a require'd helper's kcdx.* call resolves to
#   "<anon>" instead of the plugin. See helper.lua for the falsifiable
#   outcome map.
#
# Lua-SURFACE PARITY NOTE: this is the Lua-surface parity test for multi-file
# plugins. C++ DLL plugins split across multiple files NATIVELY — the linker
# handles it, and a DLL plugin's identity is its handle (passed to every
# kcdxPlugin_Load), not a Lua source path. There is therefore no C++ mirror
# owed for this capability; this test brings the Lua require path to parity
# with what C++ already does for free, and exercises it specifically.
#
# This plugin is PURE LUA (no DLL): pure-Lua plugins need no CMakeLists entry
# (cap-24-lifecycle-events is the structural mirror).
#
# Test mode: boot-only. The require resolves at plugin load; the helper
# subscribes at load; the publish fires from the input_loaded deferred
# callback on the first update tick; the subscription callback completes the
# assertion by the main menu. No console / no in-game gesture.

[kcdx]
test_suite_only = true

[plugin]
name                = "kcdx.cap-25-multifile-attribution"
display_name        = "CAP-25 multi-file plugin + complete attribution"
author              = "kcdx"
description         = "A single pure-Lua plugin split across plugin.lua + a require'd helper.lua; proves the helper's kcdx.* calls resolve to the plugin (not <anon>) via the require'd-source attribution fix."
version             = "0.1.0"
kcdx_min_version    = "0.1.0"
version_independent = true
log_level           = "info"
test_names          = ["CAP-25-multifile-attribution"]

[entrypoints]
lua = "plugin.lua"
